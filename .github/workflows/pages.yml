# Build the database and the app, publish on GitHub Pages.
# One-time setup in the repo: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Build and publish the app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit (the tag is only a comment), as in Tsheh-tû.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Python packages
        run: pip install -r requirements.txt

      # open data sources (pinned in data/fetch.sh): downloaded once, then cached
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw
          key: raw-${{ hashFiles('data/fetch.sh') }}

      - name: Database
        run: make db

      - name: Check lessons
        run: make lint

      - name: App
        run: make app

      - name: Site (installable app, icon, full screen, offline)
        run: python3 tools/site.py _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
