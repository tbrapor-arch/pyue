# Sample lesson used only to check the app locally (PYUE_FIXTURES=1 make app). Not part of the course.
id: 1
title: {en: "Back early", jyutping: "zou2 faan1", hanzi: "早返"}
genre: dialogue
review: false
setting: "A weekday afternoon in a flat in Mong Kok."
dialogue:
  - {n: 1, speaker: 阿明, hanzi: "你今日點解咁早返嚟呀？", jyutping: "nei5 gam1 jat6 dim2 gaai2 gam3 zou2 faan1 lai4 aa3?", en: "Why are you back so early today?"}
  - {n: 2, speaker: Sam, hanzi: "公司冷氣壞咗，老細叫我哋返屋企做嘢。", jyutping: "gung1 si1 laang5 hei3 waai6 zo2, lou5 sai3 giu3 ngo5 dei6 faan1 uk1 kei2 zou6 je5.", en: "The air conditioning at the office broke down, so the boss told us to work from home."}
  - {n: 3, speaker: 阿明, hanzi: "咁好呀！你食咗飯未？", jyutping: "gam2 hou2 aa3! nei5 sik6 zo2 faan6 mei6?", en: "Lucky you! Have you eaten?"}
  - {n: 4, speaker: Sam, hanzi: "未呀，我好肚餓。我哋去樓下茶餐廳食嘢好唔好？", jyutping: "mei6 aa3, ngo5 hou2 tou5 ngo6. ngo5 dei6 heoi3 lau4 haa6 caa4 caan1 teng1 sik6 je5 hou2 m4 hou2?", en: "Not yet, I'm starving. Shall we go and eat at the café downstairs?"}
  - {n: 5, speaker: 阿明, hanzi: "好，我想食菠蘿包，飲杯凍奶茶。", jyutping: "hou2, ngo5 soeng2 sik6 bo1 lo4 baau1, jam2 bui1 dung3 naai5 caa4.", en: "OK, I fancy a pineapple bun and a glass of iced milk tea."}
notes:
  - {ref: 2, topic: grammar, text: "咗 zo2 after a verb marks a completed action: 壞咗 'has broken down'."}
  - {ref: 3, topic: grammar, text: "V咗…未？ asks whether something has happened yet: 食咗飯未？ 'have you eaten yet?' Answer 未 'not yet' or 食咗 'yes'."}
  - {ref: 4, topic: culture, text: "茶餐廳 caa4 caan1 teng1: the Hong Kong café, with milk tea, pineapple buns and macaroni soup."}
new_words:
  - {jyutping: "laang5 hei3", hanzi: 冷氣, en: "air conditioning"}
  - {jyutping: "lou5 sai3", hanzi: 老細, en: "boss"}
  - {jyutping: "tou5 ngo6", hanzi: 肚餓, en: "hungry"}
  - {jyutping: "caa4 caan1 teng1", hanzi: 茶餐廳, en: "Hong Kong-style café"}
  - {jyutping: "bo1 lo4 baau1", hanzi: 菠蘿包, en: "pineapple bun"}
exercises:
  translate:
    - {hanzi: "我哋返屋企做嘢。", jyutping: "ngo5 dei6 faan1 uk1 kei2 zou6 je5.", en: "We work from home."}
  fill:
    - {hanzi: "你食咗飯___？", jyutping: "nei5 sik6 zo2 faan6 ___?", answer: "mei6", answer_hanzi: 未, en: "Have you eaten yet?"}
