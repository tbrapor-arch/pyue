exercises:
  translate:
    - {hanzi: "我哋先食飯，然後去睇戲，最後搭船返屋企。", jyutping: "ngo5 dei6 sin1 sik6 faan6, jin4 hau6 heoi3 tai2 hei3, zeoi3 hau6 daap3 syun4 faan1 uk1 kei2.", en: "First we'll eat, then go to the cinema, and finally take the ferry home."}
    - {hanzi: "佢一邊踩單車，一邊唱歌。", jyutping: "keoi5 jat1 bin1 caai2 daan1 ce1, jat1 bin1 coeng3 go1.", en: "He sings while he cycles."}
    - {hanzi: "我一飲咖啡就瞓唔着。", jyutping: "ngo5 jat1 jam2 gaa3 fe1 zau6 fan3 m4 zoek6.", en: "Whenever I drink coffee I can't sleep."}
    - {hanzi: "落船之前，記得攞齊啲嘢。", jyutping: "lok6 syun4 zi1 cin4, gei3 dak1 lo2 cai4 di1 je5.", en: "Before getting off the ferry, remember to take all your things."}
    - {hanzi: "大部分同學畢業之後都搬咗出市區。", jyutping: "daai6 bou6 fan6 tung4 hok6 bat1 jip6 zi1 hau6 dou1 bun1 zo2 ceot1 si5 keoi1.", en: "Most of my classmates moved out to the city after graduating."}
  fill:
    - {hanzi: "___去北帝廟，___去東灣。", jyutping: "___ heoi3 bak1 dai3 miu2, ___ heoi3 dung1 waan1.", answer: "sin1 / jin4 hau6", answer_hanzi: 先 / 然後, en: "First the Pak Tai Temple, then Tung Wan."}
    - {hanzi: "我___放學就去游水。", jyutping: "ngo5 ___ fong3 hok6 zau6 heoi3 jau4 seoi2.", answer: "jat1", answer_hanzi: 一, en: "As soon as school was out I'd go swimming."}
    - {hanzi: "你一路食，我___講。", jyutping: "nei5 jat1 lou6 sik6, ngo5 ___ gong2.", answer: "jat1 lou6", answer_hanzi: 一路, en: "You eat, and I'll talk while you eat."}
    - {hanzi: "食到你飽___！", jyutping: "sik6 dou3 nei5 baau2 ___!", answer: "wai4 zi2", answer_hanzi: 為止, en: "Eat till you're full!"}
    - {hanzi: "佢唔係講笑，佢___㗎。", jyutping: "keoi5 m4 hai6 gong2 siu3, keoi5 ___ gaa3.", answer: "gong2 zan1", answer_hanzi: 講真, en: "He's not joking, he means it."}
