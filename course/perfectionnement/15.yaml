exercises:
  translate:
    - {hanzi: "雖然佢好忙，但係佢日日都嚟。", jyutping: "seoi1 jin4 keoi5 hou2 mong4, daan6 hai6 keoi5 jat6 jat6 dou1 lai4.", en: "Although he's very busy, he comes every day."}
    - {hanzi: "就算落雨，我都要去。", jyutping: "zau6 syun3 lok6 jyu5, ngo5 dou1 jiu3 heoi3.", en: "Even if it rains, I'm going."}
    - {hanzi: "除非你請我食飯，唔係我唔幫你。", jyutping: "ceoi4 fei1 nei5 ceng2 ngo5 sik6 faan6, m4 hai6 ngo5 m4 bong1 nei5.", en: "Unless you buy me dinner, I won't help you."}
    - {hanzi: "呢間舖平啲，而且近啲。", jyutping: "ni1 gaan1 pou3 peng4 di1, ji4 ce2 kan5 di1.", en: "This shop is cheaper, and it's closer too."}
    - {hanzi: "加價唔會多咗客，反而會少咗客。", jyutping: "gaa1 gaa3 m4 wui5 do1 zo2 haak3, faan2 ji4 wui5 siu2 zo2 haak3.", en: "Raising prices won't bring more customers; on the contrary, it'll lose some."}
  fill:
    - {hanzi: "___有手續費，___多咗新客。", jyutping: "___ jau5 sau2 zuk6 fai3, ___ do1 zo2 san1 haak3.", answer: "seoi1 jin4 / daan6 hai6", answer_hanzi: 雖然 / 但係, en: "There's a fee, but there are more new customers."}
    - {hanzi: "你再___吓，我唔使你即刻答。", jyutping: "nei5 zoi3 ___ haa5, ngo5 m4 sai2 nei5 zik1 hak1 daap3.", answer: "haau2 leoi6", answer_hanzi: 考慮, en: "Think it over; you don't have to answer right away."}
    - {hanzi: "兩隊都係一比一，___。", jyutping: "loeng5 deoi2 dou1 hai6 jat1 bei2 jat1, ___.", answer: "daa2 wo4", answer_hanzi: 打和, en: "Both teams are one–one: a draw."}
    - {hanzi: "你哋兩個一早___埋，我唔信你哋。", jyutping: "nei5 dei6 loeng5 go3 jat1 zou2 ___ maai4, ngo5 m4 seon3 nei5 dei6.", answer: "gaap3", answer_hanzi: 夾, en: "You two were in this together from the start; I don't trust you."}
    - {hanzi: "買一送一，好___！", jyutping: "maai5 jat1 sung3 jat1, hou2 ___!", answer: "dai2", answer_hanzi: 抵, en: "Buy one, get one free: what a deal!"}
