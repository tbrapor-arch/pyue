exercises:
  translate:
    - {hanzi: "我訓練咗四個禮拜，為咗扒龍舟。", jyutping: "ngo5 fan3 lin6 zo2 sei3 go3 lai5 baai3, wai6 zo2 paa4 lung4 zau1.", en: "I trained for four weeks in order to race the dragon boat."}
    - {hanzi: "佢攰到連槳都拎唔起。", jyutping: "keoi5 gui6 dou3 lin4 zoeng2 dou1 ling1 m4 hei2.", en: "He's so tired he can't even lift the paddle."}
    - {hanzi: "全隊要齊，跟住鼓手嘅拍子。", jyutping: "cyun4 deoi2 jiu3 cai4, gan1 zyu6 gu2 sau2 ge3 paak3 zi2.", en: "The whole team has to be in sync, following the drummer's beat."}
    - {hanzi: "端午前後成日行雷落大雨。", jyutping: "dyun1 ng5 cin4 hau6 sing4 jat6 haang4 leoi4 lok6 daai6 jyu5.", en: "Around Tuen Ng there's thunder and heavy rain all the time."}
    - {hanzi: "我哋今年攞咗季軍，名次好咗。", jyutping: "ngo5 dei6 gam1 nin4 lo2 zo2 gwai3 gwan1, ming4 ci3 hou2 zo2.", en: "This year we came third; our ranking has improved."}
  fill:
    - {hanzi: "扒龍舟係為咗___屈原。", jyutping: "paa4 lung4 zau1 hai6 wai6 zo2 ___ wat1 jyun4.", answer: "gei2 nim6", answer_hanzi: 紀念, en: "Dragon-boat racing is to commemorate Qu Yuan."}
    - {hanzi: "我手臂痛___瞓唔着。", jyutping: "ngo5 sau2 bei3 tung3 ___ fan3 m4 zoek6.", answer: "dou3", answer_hanzi: 到, en: "My arm hurts so much I can't sleep."}
    - {hanzi: "落水之前要著好___。", jyutping: "lok6 seoi2 zi1 cin4 jiu3 zoek3 hou2 ___.", answer: "gau3 sang1 ji1", answer_hanzi: 救生衣, en: "Put your life jacket on before going in the water."}
    - {hanzi: "坐喺龍尾___嘅係我阿叔個仔。", jyutping: "co5 hai2 lung4 mei5 ___ ge3 hai6 ngo5 aa3 suk1 go3 zai2.", answer: "zoeng2 to4", answer_hanzi: 掌舵, en: "The one steering at the tail is my uncle's son."}
    - {hanzi: "比賽之前要___先。", jyutping: "bei2 coi3 zi1 cin4 jiu3 ___ sin1.", answer: "jit6 san1", answer_hanzi: 熱身, en: "You have to warm up before the race."}
