    - {hanzi: "我由細到大睇港產片學廣東話。", jyutping: "ngo5 jau4 sai3 dou3 daai6 tai2 gong2 caan2 pin2 hok6 gwong2 dung1 waa2.", en: "I learned Cantonese from Hong Kong films growing up."}
    - {hanzi: "你屋企講廣東話，定係其他方言？", jyutping: "nei5 uk1 kei2 gong2 gwong2 dung1 waa2, ding6 hai6 kei4 taa1 fong1 jin4?", en: "Does your family speak Cantonese, or another dialect?"}
