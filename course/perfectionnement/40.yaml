exercises:
  translate:
    - {hanzi: "部機快過人手一倍。", jyutping: "bou6 gei1 faai3 gwo3 jan4 sau2 jat1 pui5.", en: "The machine is twice as fast as doing it by hand."}
    - {hanzi: "呢杯奶茶冇嗰杯咁濃郁。", jyutping: "ni1 bui1 naai5 caa4 mou5 go2 bui1 gam3 nung4 juk1.", en: "This milk tea isn't as rich as that one."}
    - {hanzi: "我越嚟越緊張。", jyutping: "ngo5 jyut6 lai4 jyut6 gan2 zoeng1.", en: "I'm getting more and more nervous."}
    - {hanzi: "啲芝士多到過頭，甜得滯。", jyutping: "di1 zi1 si2 do1 dou3 gwo3 tau4, tim4 dak1 zai6.", en: "There's far too much cheese, and it's too sweet."}
    - {hanzi: "佢以一分勝出，我哋屈居亞軍。", jyutping: "keoi5 ji5 jat1 fan1 sing3 ceot1, ngo5 dei6 wat1 geoi1 aa3 gwan1.", en: "They won by one point; we had to settle for second."}
  fill:
    - {hanzi: "新潮嘅奶茶___梁記咁滑。", jyutping: "san1 ciu4 ge3 naai5 caa4 ___ loeng4 gei3 gam3 waat6.", answer: "mou5", answer_hanzi: 冇, en: "新潮's milk tea isn't as smooth as 梁記's."}
    - {hanzi: "快係快，___冇乜茶味。", jyutping: "faai3 hai6 faai3, ___ mou5 mat1 caa4 mei6.", answer: "bat1 gwo3", answer_hanzi: 不過, en: "It's fast, sure, but it doesn't taste of much tea."}
    - {hanzi: "茶同奶好___，一啲都唔澀。", jyutping: "caa4 tung4 naai5 hou2 ___, jat1 di1 dou1 m4 saap3.", answer: "ping4 hang4", answer_hanzi: 平衡, en: "The tea and milk are well balanced, not astringent at all."}
    - {hanzi: "結果___，梁記係亞軍。", jyutping: "git3 gwo2 ___, loeng4 gei3 hai6 aa3 gwan1.", answer: "kit3 hiu2", answer_hanzi: 揭曉, en: "The results are out: 梁記 is second."}
    - {hanzi: "差一分就贏，真係好___。", jyutping: "caa1 jat1 fan1 zau6 jeng4, zan1 hai6 hou2 ___.", answer: "ho2 sik1", answer_hanzi: 可惜, en: "One point short of winning: such a pity."}
