exercises:
  translate:
    - {hanzi: "咁多嘢一齊用，實跳掣。", jyutping: "gam3 do1 je5 jat1 cai4 jung6, sat6 tiu3 zai3.", en: "With all that on at once, the power's bound to trip."}
    - {hanzi: "大家拍手拍到成條街都震。", jyutping: "daai6 gaa1 paak3 sau2 paak3 dou3 seng4 tiu4 gaai1 dou1 zan3.", en: "Everyone clapped so hard the whole street shook."}
    - {hanzi: "冇咗咪，佢就用把聲清唱。", jyutping: "mou5 zo2 mai1, keoi5 zau6 jung6 baa2 seng1 cing1 coeng3.", en: "Without a mic, he sang unaccompanied."}
    - {hanzi: "我哋夾開 band，識得執生。", jyutping: "ngo5 dei6 gaap3 hoi1 band, sik1 dak1 zap1 saang1.", en: "We're used to playing in a band; we know how to improvise."}
    - {hanzi: "梁伯跟住唱起上嚟，成條街都唱落去。", jyutping: "loeng4 baak3 gan1 zyu6 coeng3 hei2 soeng5 lai4, seng4 tiu4 gaai1 dou1 coeng3 lok6 heoi3.", en: "梁伯 started singing along, and the whole street kept singing."}
  fill:
    - {hanzi: "樂仔唱___聲都啞。", jyutping: "lok6 zai2 coeng3 ___ seng1 dou1 aa2.", answer: "dou3", answer_hanzi: 到, en: "樂仔 sang himself hoarse."}
    - {hanzi: "我唱___粵曲，第一次唱你哋啲歌。", jyutping: "ngo5 coeng3 ___ jyut6 kuk1, dai6 jat1 ci3 coeng3 nei5 dei6 di1 go1.", answer: "hoi1", answer_hanzi: 開, en: "I'm used to singing Cantonese opera; it's my first time singing your songs."}
    - {hanzi: "啲燈着___晒。", jyutping: "di1 dang1 zoek6 ___ saai3.", answer: "faan1", answer_hanzi: 返, en: "The lights all came back on."}
    - {hanzi: "冇電，細So 攞起個___。", jyutping: "mou5 din6, sai3 so1 lo2 hei2 go3 ___.", answer: "muk6 git3 taa1", answer_hanzi: 木結他, en: "With no power, 細So picked up the acoustic guitar."}
    - {hanzi: "對面啲街坊打開窗，___出嚟。", jyutping: "deoi3 min6 di1 gaai1 fong1 daa2 hoi1 coeng1, ___ ceot1 lai4.", answer: "taam3 tau4", answer_hanzi: 探頭, en: "The neighbours opposite opened their windows and leaned out."}
