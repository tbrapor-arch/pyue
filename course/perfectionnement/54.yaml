exercises:
  translate:
    - {hanzi: "你想移民，定係留低？", jyutping: "nei5 soeng2 ji4 man4, ding6 hai6 lau4 dai1?", en: "Do you want to emigrate, or stay?"}
    - {hanzi: "我哋夏天或者聖誕去探佢。", jyutping: "ngo5 dei6 haa6 tin1 waak6 ze2 sing3 daan3 heoi3 taam3 keoi5.", en: "We'll visit him in summer or at Christmas."}
    - {hanzi: "我寧願輪候，都唔想去私家醫院。", jyutping: "ngo5 ning4 jyun6 leon4 hau6, dou1 m4 soeng2 heoi3 si1 gaa1 ji1 jyun2.", en: "I'd rather wait my turn than go to a private hospital."}
    - {hanzi: "佢一個人喺外國，好孤獨。", jyutping: "keoi5 jat1 go3 jan4 hai2 ngoi6 gwok3, hou2 gu1 duk6.", en: "He's all alone abroad; he's very lonely."}
    - {hanzi: "你哋兩個講得都有道理。", jyutping: "nei5 dei6 loeng5 go3 gong2 dak1 dou1 jau5 dou6 lei5.", en: "You both have a point."}
  fill:
    - {hanzi: "你想飲茶___咖啡？", jyutping: "nei5 soeng2 jam2 caa4 ___ gaa3 fe1?", answer: "ding6 hai6", answer_hanzi: 定係, en: "Would you like tea or coffee?"}
    - {hanzi: "我聽日___後日去。", jyutping: "ngo5 ting1 jat6 ___ hau6 jat6 heoi3.", answer: "waak6 ze2", answer_hanzi: 或者, en: "I'll go tomorrow or the day after."}
    - {hanzi: "英國醫療免費，係最好嘅___之一。", jyutping: "jing1 gwok3 ji1 liu4 min5 fai3, hai6 zeoi3 hou2 ge3 ___ zi1 jat1.", answer: "fuk1 lei6", answer_hanzi: 福利, en: "Free healthcare is one of England's best benefits."}
    - {hanzi: "老人家講落葉___。", jyutping: "lou5 jan4 gaa1 gong2 lok6 jip6 ___.", answer: "gwai1 gan1", answer_hanzi: 歸根, en: "The old saying: fallen leaves return to their roots."}
    - {hanzi: "香港啲___越嚟越貴。", jyutping: "hoeng1 gong2 di1 ___ jyut6 lai4 jyut6 gwai3.", answer: "mat6 gaa3", answer_hanzi: 物價, en: "Prices in Hong Kong keep going up."}
