exercises:
  translate:
    - {hanzi: "先將啲雜草鋤走，再將墓碑抹乾淨。", jyutping: "sin1 zoeng1 di1 zaap6 cou2 co4 zau2, zoi3 zoeng1 mou6 bei1 maat3 gon1 zeng6.", en: "First hoe away the weeds, then wipe the headstone clean."}
    - {hanzi: "我行唔郁喇，條路越嚟越斜。", jyutping: "ngo5 haang4 m4 juk1 laa3, tiu4 lou6 jyut6 lai4 jyut6 ce3.", en: "I can't walk any more; the path's getting steeper and steeper."}
    - {hanzi: "你行唔行得快過我？", jyutping: "nei5 haang4 m4 haang4 dak1 faai3 gwo3 ngo5?", en: "Can you walk faster than me?"}
    - {hanzi: "重陽節，好多人登高同拜山。", jyutping: "cung4 joeng4 zit3, hou2 do1 jan4 dang1 gou1 tung4 baai3 saan1.", en: "At Chung Yeung, lots of people climb hills and visit graves."}
    - {hanzi: "佢將三支香插落香爐。", jyutping: "keoi5 zoeng1 saam1 zi1 hoeng1 caap3 lok6 hoeng1 lou4.", en: "He put three incense sticks into the burner."}
  fill:
    - {hanzi: "阿果，你___啲生果擺好。", jyutping: "aa3 gwo2, nei5 ___ di1 saang1 gwo2 baai2 hou2.", answer: "zoeng1", answer_hanzi: 將, en: "A-Gwo, set out the fruit."}
    - {hanzi: "盂蘭節，啲人喺街邊燒___。", jyutping: "jyu4 laan4 zit3, di1 jan4 hai2 gaai1 bin1 siu1 ___.", answer: "ji1 zi2", answer_hanzi: 衣紙, en: "At the Hungry Ghost Festival, people burn paper offerings by the roadside."}
    - {hanzi: "我行唔___，仲有幾多級？", jyutping: "ngo5 haang4 m4 ___, zung6 jau5 gei2 do1 kap1?", answer: "juk1", answer_hanzi: 郁, en: "I can't walk any more; how many steps are left?"}
    - {hanzi: "佢哋兩個一路行一路___。", jyutping: "keoi5 dei6 loeng5 go3 jat1 lou6 haang4 jat1 lou6 ___.", answer: "dau3", answer_hanzi: 鬥, en: "The two of them competed all the way."}
    - {hanzi: "拜完佢向墓碑___咗三個躬。", jyutping: "baai3 jyun4 keoi5 hoeng3 mou6 bei1 ___ zo2 saam1 go3 gung1.", answer: "guk1", answer_hanzi: 鞠, en: "After the offerings he bowed three times to the headstone."}
