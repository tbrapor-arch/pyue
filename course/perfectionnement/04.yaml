exercises:
  translate:
    - {hanzi: "啲嘢太多，我今晚實做唔晒。", jyutping: "di1 je5 taai3 do1, ngo5 gam1 maan5 sat6 zou6 m4 saai3.", en: "There's too much to do; I'll never finish it all tonight."}
    - {hanzi: "佢攰到坐喺度都瞓着咗。", jyutping: "keoi5 gui6 dou3 co5 hai2 dou6 dou1 fan3 zoek6 zo2.", en: "He was so tired he fell asleep sitting down."}
    - {hanzi: "我盡量聽朝十點之前搞掂。", jyutping: "ngo5 zeon6 loeng6 ting1 ziu1 sap6 dim2 zi1 cin4 gaau2 dim6.", en: "I'll do my best to get it done before ten tomorrow morning."}
    - {hanzi: "我一路都想辭職，不過壓力太大，一直冇講。", jyutping: "ngo5 jat1 lou6 dou1 soeng2 ci4 zik1, bat1 gwo3 aat3 lik6 taai3 daai6, jat1 zik6 mou5 gong2.", en: "I've wanted to resign all along, but the pressure was too great and I never said so."}
    - {hanzi: "你試過喺公司通頂未？", jyutping: "nei5 si3 gwo3 hai2 gung1 si1 tung1 deng2 mei6?", en: "Have you ever pulled an all-nighter at the office?"}
  fill:
    - {hanzi: "啲外賣凍晒，我食唔___。", jyutping: "di1 ngoi6 maai6 dung3 saai3, ngo5 sik6 m4 ___.", answer: "lok6", answer_hanzi: 落, en: "The takeaway has gone cold; I can't eat it."}
    - {hanzi: "巴士咁慢，我哋實趕唔___。", jyutping: "baa1 si2 gam3 maan6, ngo5 dei6 sat6 gon2 m4 ___.", answer: "cit3", answer_hanzi: 切, en: "The bus is so slow, we'll never make it in time."}
    - {hanzi: "佢講笑話，講___成班人都笑。", jyutping: "keoi5 gong2 siu3 waa2, gong2 ___ seng4 baan1 jan4 dou1 siu3.", answer: "dou3", answer_hanzi: 到, en: "He told jokes until the whole group was laughing."}
    - {hanzi: "我搵___我個銀包，點算？", jyutping: "ngo5 wan2 ___ ngo5 go3 ngan4 baau1, dim2 syun3?", answer: "m4 dou2", answer_hanzi: 唔到, en: "I can't find my wallet, what am I going to do?"}
    - {hanzi: "做多幾年你就___㗎喇。", jyutping: "zou6 do1 gei2 nin4 nei5 zau6 ___ gaa3 laa3.", answer: "gwaan3", answer_hanzi: 慣, en: "A few more years and you'll be used to it."}
