exercises:
  translate:
    - {hanzi: "我嚟香港係為咗學廣東話。", jyutping: "ngo5 lai4 hoeng1 gong2 hai6 wai6 zo2 hok6 gwong2 dung1 waa2.", en: "I came to Hong Kong to learn Cantonese."}
    - {hanzi: "佢出咗去買生果。", jyutping: "keoi5 ceot1 zo2 heoi3 maai5 saang1 gwo2.", en: "She's gone out to buy fruit."}
    - {hanzi: "新年啲親戚成日問長問短，好煩。", jyutping: "san1 nin4 di1 can1 cik1 sing4 jat6 man6 coeng4 man6 dyun2, hou2 faan4.", en: "At New Year the relatives ask endless questions; it's so annoying."}
    - {hanzi: "佢哋兩個好襯，不如快啲結婚。", jyutping: "keoi5 dei6 loeng5 go3 hou2 can3, bat1 jyu4 faai3 di1 git3 fan1.", en: "Those two are a perfect match; they should hurry up and get married."}
    - {hanzi: "未結婚嘅人都有利是，同年紀冇關係。", jyutping: "mei6 git3 fan1 ge3 jan4 dou1 jau5 lai6 si6, tung4 nin4 gei2 mou5 gwaan1 hai6.", en: "Unmarried people all get red packets; age has nothing to do with it."}
  fill:
    - {hanzi: "佢問你人工，係___表示關心。", jyutping: "keoi5 man6 nei5 jan4 gung1, hai6 ___ biu2 si6 gwaan1 sam1.", answer: "wai6 zo2", answer_hanzi: 為咗, en: "He asks about your salary to show he cares."}
    - {hanzi: "結咗婚嘅人要___利是。", jyutping: "git3 zo2 fan1 ge3 jan4 jiu3 ___ lai6 si6.", answer: "paai3", answer_hanzi: 派, en: "Married people have to hand out red packets."}
    - {hanzi: "我姑媽三十年前___咗嚟坪洲。", jyutping: "ngo5 gu1 maa1 saam1 sap6 nin4 cin4 ___ zo2 lai4 ping4 zau1.", answer: "gaa3", answer_hanzi: 嫁, en: "My aunt married and moved to Peng Chau thirty years ago."}
    - {hanzi: "我都有___？多謝姑姐！", jyutping: "ngo5 dou1 jau5 ___? do1 ze6 gu1 ze1!", answer: "fan2", answer_hanzi: 份, en: "I get one too? Thank you, Auntie!"}
    - {hanzi: "食完飯行吓山，幫吓___。", jyutping: "sik6 jyun4 faan6 haang4 haa5 saan1, bong1 haa5 ___.", answer: "siu1 faa3", answer_hanzi: 消化, en: "After the meal, a little walk up the hill helps the digestion."}
