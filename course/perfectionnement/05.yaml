exercises:
  translate:
    - {hanzi: "如果聽日落雨嘅話，我哋就唔去。", jyutping: "jyu4 gwo2 ting1 jat6 lok6 jyu5 ge3 waa2, ngo5 dei6 zau6 m4 heoi3.", en: "If it rains tomorrow, we won't go."}
    - {hanzi: "快啲走啦，唔係嘅話趕唔切。", jyutping: "faai3 di1 zau2 laa1, m4 hai6 ge3 waa2 gon2 m4 cit3.", en: "Hurry up, otherwise we won't make it."}
    - {hanzi: "佢根本唔知個業主係邊個。", jyutping: "keoi5 gan1 bun2 m4 zi1 go3 jip6 zyu2 hai6 bin1 go3.", en: "He has no idea at all who the landlord is."}
    - {hanzi: "經濟唔好嘅時候，好多小店都要執笠。", jyutping: "ging1 zai3 m4 hou2 ge3 si4 hau6, hou2 do1 siu2 dim3 dou1 jiu3 zap1 lap1.", en: "When the economy is bad, a lot of small shops have to close."}
    - {hanzi: "加租唔單止影響舖頭，連住喺度嘅街坊都受影響。", jyutping: "gaa1 zou1 m4 daan1 zi2 jing2 hoeng2 pou3 tau2, lin4 zyu6 hai2 dou6 ge3 gaai1 fong1 dou1 sau6 jing2 hoeng2.", en: "Rent rises don't only affect shops; even the people who live here are affected."}
  fill:
    - {hanzi: "我___冇得揀，唔交租就要搬。", jyutping: "ngo5 ___ mou5 dak1 gaan2, m4 gaau1 zou1 zau6 jiu3 bun1.", answer: "gan1 bun2", answer_hanzi: 根本, en: "I simply had no choice: pay the rent or move."}
    - {hanzi: "租金加咗一___，即係貴咗兩倍咁多。", jyutping: "zou1 gam1 gaa1 zo2 jat1 ___, zik1 hai6 gwai3 zo2 loeng5 pui5 gam3 do1.", answer: "pui5", answer_hanzi: 倍, en: "The rent has doubled: it's twice as expensive."}
    - {hanzi: "我___有加價，唔係嘅話就要執笠。", jyutping: "ngo5 ___ jau5 gaa1 gaa3, m4 hai6 ge3 waa2 zau6 jiu3 zap1 lap1.", answer: "wai4", answer_hanzi: 唯, en: "I have no choice but to raise prices, otherwise I'll have to close down."}
    - {hanzi: "佢___冇遲到過，今日唔知發生咩事。", jyutping: "keoi5 ___ mou5 ci4 dou3 gwo3, gam1 jat6 m4 zi1 faat3 sang1 me1 si6.", answer: "cung4 loi4", answer_hanzi: 從來, en: "He's never been late before; I don't know what happened today."}
    - {hanzi: "我___長遠嚟講，租金會跌。", jyutping: "ngo5 ___ coeng4 jyun5 lai4 gong2, zou1 gam1 wui5 dit3.", answer: "soeng1 seon3", answer_hanzi: 相信, en: "I believe that in the long run rents will fall."}
