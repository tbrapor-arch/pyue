exercises:
  translate:
    - {hanzi: "呢首歌令我諗起屋企。", jyutping: "ni1 sau2 go1 ling6 ngo5 nam2 hei2 uk1 kei2.", en: "This song makes me think of home."}
    - {hanzi: "落大雨，搞到我哋全身濕晒。", jyutping: "lok6 daai6 jyu5, gaau2 dou3 ngo5 dei6 cyun4 san1 sap1 saai3.", en: "It poured, and we got soaked through."}
    - {hanzi: "條村以前好窮，而家變成咗旅遊景點。", jyutping: "tiu4 cyun1 ji5 cin4 hou2 kung4, ji4 gaa1 bin3 sing4 zo2 leoi5 jau4 ging2 dim2.", en: "The village used to be poor; now it's become a tourist spot."}
    - {hanzi: "佢喺我面前喊，我都好難過。", jyutping: "keoi5 hai2 ngo5 min6 cin4 haam3, ngo5 dou1 hou2 naan4 gwo3.", en: "She cried in front of me, and I felt sad too."}
    - {hanzi: "唔好欺負細佬！", jyutping: "m4 hou2 hei1 fu6 sai3 lou2!", en: "Don't pick on your little brother!"}
  fill:
    - {hanzi: "個故事___我好感動。", jyutping: "go3 gu3 si6 ___ ngo5 hou2 gam2 dung6.", answer: "ling6", answer_hanzi: 令, en: "The story moved me deeply."}
    - {hanzi: "樓價咁貴，___好多後生買唔起樓。", jyutping: "lau4 gaa3 gam3 gwai3, ___ hou2 do1 hau6 saang1 maai5 m4 hei2 lau2.", answer: "gaau2 dou3", answer_hanzi: 搞到, en: "Property is so expensive that many young people can't afford a flat."}
    - {hanzi: "佢同個仔___咗一嚿石。", jyutping: "keoi5 tung4 go3 zai2 ___ zo2 jat1 gau6 sek6.", answer: "bin3 sing4", answer_hanzi: 變成, en: "She and her son turned into a rock."}
    - {hanzi: "佢日日___住個海，等老公返嚟。", jyutping: "keoi5 jat6 jat6 ___ zyu6 go3 hoi2, dang2 lou5 gung1 faan1 lai4.", answer: "mong6", answer_hanzi: 望, en: "Every day she gazed at the sea, waiting for her husband to come back."}
    - {hanzi: "有人走，有人留，___嘅原因。", jyutping: "jau5 jan4 zau2, jau5 jan4 lau4, ___ ge3 jyun4 jan1.", answer: "gok3 jau5 gok3", answer_hanzi: 各有各, en: "Some leave, some stay; each has their own reasons."}
