    - {hanzi: "今晚係我哋第一___表演。", jyutping: "gam1 maan5 hai6 ngo5 dei6 dai6 jat1 ___ biu2 jin2.", answer: "coeng4", answer_hanzi: 場, en: "Tonight is our first show."}
