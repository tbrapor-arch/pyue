    - {hanzi: "佢哋冇以前咁多客，因為優惠完咗。", jyutping: "keoi5 dei6 mou5 ji5 cin4 gam3 do1 haak3, jan1 wai6 jau1 wai6 jyun4 zo2.", en: "They don't have as many customers as before, because the offer is over."}
