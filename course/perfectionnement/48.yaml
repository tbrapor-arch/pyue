exercises:
  translate:
    - {hanzi: "個個都好驚，年年都要拜神。", jyutping: "go3 go3 dou1 hou2 geng1, nin4 nin4 dou1 jiu3 baai3 san4.", en: "Everyone was terrified, so every year they have to worship the gods."}
    - {hanzi: "太平清醮嗰三日，成個島都食齋。", jyutping: "taai3 ping4 cing1 ziu3 go2 saam1 jat6, seng4 go3 dou2 dou1 sik6 zaai1.", en: "For those three festival days, the whole island eats vegetarian."}
    - {hanzi: "座包山冧咗之後，政府禁止咗搶包山。", jyutping: "zo6 baau1 saan1 lam3 zo2 zi1 hau6, zing3 fu2 gam3 zi2 zo2 coeng2 baau1 saan1.", en: "After the bun tower collapsed, the government banned the scramble."}
    - {hanzi: "慢慢嚟，試吓再印一個。", jyutping: "maan6 maan2 lai4, si3 haa5 zoi3 jan3 jat1 go3.", en: "Take your time; try stamping another one."}
    - {hanzi: "大家食得開開心心就得。", jyutping: "daai6 gaa1 sik6 dak1 hoi1 hoi1 sam1 sam1 zau6 dak1.", en: "As long as everyone enjoys eating."}
  fill:
    - {hanzi: "搓到個粉滑滑哋，先好___。", jyutping: "co1 dou3 go3 fan2 waat6 waat2 dei2, sin1 hou2 ___.", answer: "faat3 haau1", answer_hanzi: 發酵, en: "Knead the dough until it's smooth; then it'll rise well."}
    - {hanzi: "啲小朋友好似吊喺___咁。", jyutping: "di1 siu2 pang4 jau5 hou2 ci5 diu3 hai2 ___ gam2.", answer: "bun3 hung1", answer_hanzi: 半空, en: "The children look as if they're hanging in mid-air."}
    - {hanzi: "鑼鼓聲___都聽到。", jyutping: "lo4 gu2 seng1 ___ dou1 teng1 dou2.", answer: "jat6 jat6", answer_hanzi: 日日, en: "You hear the drums and gongs every day."}
    - {hanzi: "到二零零五年先___搶包山。", jyutping: "dou3 ji6 ling4 ling4 ng5 nin4 sin1 ___ coeng2 baau1 saan1.", answer: "fui1 fuk6", answer_hanzi: 恢復, en: "The bun scramble only came back in 2005."}
    - {hanzi: "每個包都要___「平安」兩個字。", jyutping: "mui5 go3 baau1 dou1 jiu3 ___ \"ping4 on1\" loeng5 go3 zi6.", answer: "jan3", answer_hanzi: 印, en: "Every bun has the two characters 'peace' stamped on it."}
