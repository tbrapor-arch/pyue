exercises:
  translate:
    - {hanzi: "就算你唔信，都要講「落地開花」。", jyutping: "zau6 syun3 nei5 m4 seon3, dou1 jiu3 gong2 \"lok6 dei6 hoi1 faa1\".", en: "Even if you don't believe it, you have to say 'falls and blossoms'."}
    - {hanzi: "除非你想帶衰成年，唔係唔好年初一掃地。", jyutping: "ceoi4 fei1 nei5 soeng2 daai3 seoi1 seng4 nin4, m4 hai6 m4 hou2 nin4 co1 jat1 sou3 dei6.", en: "Unless you want bad luck all year, don't sweep on New Year's Day."}
    - {hanzi: "新年前我哋要將成間屋清潔一次。", jyutping: "san1 nin4 cin4 ngo5 dei6 jiu3 zoeng1 seng4 gaan1 uk1 cing1 git3 jat1 ci3.", en: "Before New Year we have to clean the whole house once."}
    - {hanzi: "新年唔好鬧交，費事成年都衰。", jyutping: "san1 nin4 m4 hou2 naau6 gaau1, fai3 si6 seng4 nin4 dou1 seoi1.", en: "Don't quarrel at New Year, so you won't have bad luck all year."}
    - {hanzi: "年初一唔好用掃把掃地。", jyutping: "nin4 co1 jat1 m4 hou2 jung6 sou3 baa2 sou3 dei6.", en: "Don't sweep the floor with a broom on New Year's Day."}
  fill:
