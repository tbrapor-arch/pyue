    - {hanzi: "正月唔好剪頭髮，___你想你舅父衰。", jyutping: "zing1 jyut6 m4 hou2 zin2 tau4 faat3, ___ nei5 soeng2 nei5 kau5 fu2 seoi1.", answer: "ceoi4 fei1", answer_hanzi: 除非, en: "Don't get a haircut in the first month, unless you want bad luck for your uncle."}
    - {hanzi: "「鞋」同「唉」___，好唔吉利。", jyutping: "\"haai4\" tung4 \"aai1\" ___, hou2 m4 gat1 lei6.", answer: "tung4 jam1", answer_hanzi: 同音, en: "'Shoe' sounds like 'sigh': very unlucky."}
    - {hanzi: "啲___掃走晒，新年先會好運。", jyutping: "di1 ___ sou3 zau2 saai3, san1 nin4 sin1 wui5 hou2 wan6.", answer: "fui1 can4", answer_hanzi: 灰塵, en: "Sweep all the dust away, and you'll have good luck in the New Year."}
    - {hanzi: "我___佢嘈，唯有照做。", jyutping: "ngo5 ___ keoi5 cou4, wai4 jau5 ziu3 zou6.", answer: "fai3 si6", answer_hanzi: 費事, en: "To stop her nagging, I just do it."}
