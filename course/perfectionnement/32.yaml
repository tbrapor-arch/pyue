exercises:
  translate:
    - {hanzi: "你一係今日續約，一係下個月搬走。", jyutping: "nei5 jat1 hai6 gam1 jat6 zuk6 joek3, jat1 hai6 haa6 go3 jyut6 bun1 zau2.", en: "Either you renew the contract today, or you move out next month."}
    - {hanzi: "你想飲咖啡，抑或飲茶？", jyutping: "nei5 soeng2 jam2 gaa3 fe1, jik1 waak6 jam2 caa4?", en: "Would you like coffee, or tea?"}
    - {hanzi: "年初三黃大仙人山人海。", jyutping: "nin4 co1 saam1 wong4 daai6 sin1 jan4 saan1 jan4 hoi2.", en: "On the third day of New Year, Wong Tai Sin is packed."}
    - {hanzi: "佢講得好模糊，我半信半疑。", jyutping: "keoi5 gong2 dak1 hou2 mou4 wu4, ngo5 bun3 seon3 bun3 ji4.", en: "What he said was very vague; I half believe it."}
    - {hanzi: "遲早要揀，唔可以成世兩頭唔到岸。", jyutping: "ci4 zou2 jiu3 gaan2, m4 ho2 ji5 seng4 sai3 loeng5 tau4 m4 dou3 ngon6.", en: "Sooner or later you have to choose; you can't spend your whole life stuck between two sides."}
  fill:
    - {hanzi: "___我哋聽日再嚟，今日太多人。", jyutping: "___ ngo5 dei6 ting1 jat6 zoi3 lai4, gam1 jat6 taai3 do1 jan4.", answer: "jat1 hai6", answer_hanzi: 一係, en: "Or else let's come again tomorrow; there are too many people today."}
    - {hanzi: "你問事業，___姻緣？", jyutping: "nei5 man6 si6 jip6, ___ jan1 jyun4?", answer: "jik1 waak6", answer_hanzi: 抑或, en: "Are you asking about your career, or about love?"}
    - {hanzi: "跪低，雙手拎住啲籤，一路___。", jyutping: "gwai6 dai1, soeng1 sau2 ling1 zyu6 di1 cim1, jat1 lou6 ___.", answer: "jiu4", answer_hanzi: 搖, en: "Kneel down, hold the sticks in both hands, and keep shaking."}
    - {hanzi: "我屬豬，今年冇___。", jyutping: "ngo5 suk6 zyu1, gam1 nin4 mou5 ___.", answer: "faan6 taai3 seoi3", answer_hanzi: 犯太歲, en: "I'm a Pig; I don't clash with the year's god this year."}
    - {hanzi: "如果心願___，就要返嚟還神。", jyutping: "jyu4 gwo2 sam1 jyun6 ___, zau6 jiu3 faan1 lai4 waan4 san4.", answer: "sat6 jin6", answer_hanzi: 實現, en: "If your wish comes true, you have to come back and thank the god."}
