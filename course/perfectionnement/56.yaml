    - {hanzi: "___你係業主，都要排隊。", jyutping: "___ nei5 hai6 jip6 zyu2, dou1 jiu3 paai4 deoi2.", answer: "zau6 syun3", answer_hanzi: 就算, en: "Even if you're the landlord, you still have to queue."}
    - {hanzi: "佢好小心___食。", jyutping: "keoi5 hou2 siu2 sam1 ___ sik6.", answer: "gam2", answer_hanzi: 咁, en: "She eats very carefully."}
    - {hanzi: "我呢個禮拜___蚊咬咗好多次。", jyutping: "ngo5 ni1 go3 lai5 baai3 ___ man1 ngaau5 zo2 hou2 do1 ci3.", answer: "bei2", answer_hanzi: 俾, en: "I've been bitten by mosquitoes many times this week."}
    - {hanzi: "我夏天再嚟，___聖誕。", jyutping: "ngo5 haa6 tin1 zoi3 lai4, ___ sing3 daan3.", answer: "waak6 ze2", answer_hanzi: 或者, en: "I'll come again in summer, or at Christmas."}
