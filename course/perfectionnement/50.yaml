exercises:
  translate:
    - {hanzi: "八號波一掛，所有學校都停課。", jyutping: "baat3 hou6 bo1 jat1 gwaa3, so2 jau5 hok6 haau6 dou1 ting4 fo3.", en: "As soon as Signal 8 goes up, all schools close."}
    - {hanzi: "掛八號波之前，我哋要落閘。", jyutping: "gwaa3 baat3 hou6 bo1 zi1 cin4, ngo5 dei6 jiu3 lok6 zaap6.", en: "We have to close up before Signal 8 goes up."}
    - {hanzi: "打風之後先出街。", jyutping: "daa2 fung1 zi1 hau6 sin1 ceot1 gaai1.", en: "Only go out after the typhoon."}
    - {hanzi: "我個航班延誤咗，旅行團都取消咗。", jyutping: "ngo5 go3 hong4 baan1 jin4 ng6 zo2, leoi5 hang4 tyun4 dou1 ceoi2 siu1 zo2.", en: "My flight's delayed, and the tour's been cancelled too."}
    - {hanzi: "唔使搶購，屋企有蠟燭同電筒。", jyutping: "m4 sai2 coeng2 kau3, uk1 kei2 jau5 laap6 zuk1 tung4 din6 tung2.", en: "No need to panic-buy; we have candles and a torch at home."}
  fill:
    - {hanzi: "颱風預料向___移動。", jyutping: "toi4 fung1 jyu6 liu6 hoeng3 ___ ji4 dung6.", answer: "sai1 bak1", answer_hanzi: 西北, en: "The typhoon is forecast to move northwest."}
    - {hanzi: "八號波一掛，渡輪全部___。", jyutping: "baat3 hou6 bo1 jat1 gwaa3, dou6 leon4 cyun4 bou6 ___.", answer: "ting4 sai2", answer_hanzi: 停駛, en: "Once Signal 8 goes up, all ferries stop running."}
    - {hanzi: "海邊地區可能有___。", jyutping: "hoi2 bin1 dei6 keoi1 ho2 nang4 jau5 ___.", answer: "seoi2 zam3", answer_hanzi: 水浸, en: "Seaside areas may flood."}
    - {hanzi: "市民應___完成防風措施。", jyutping: "si5 man4 jing1 ___ jyun4 sing4 fong4 fung1 cou3 si1.", answer: "zeon6 zou2", answer_hanzi: 盡早, en: "The public should complete their precautions as early as possible."}
    - {hanzi: "對面個招牌俾風___到搖嚟搖去。", jyutping: "deoi3 min6 go3 ziu1 paai4 bei2 fung1 ___ dou3 jiu4 lai4 jiu4 heoi3.", answer: "ceoi1", answer_hanzi: 吹, en: "The sign across the street is being blown back and forth by the wind."}
