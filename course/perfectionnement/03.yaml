exercises:
  translate:
    - {hanzi: "佢話佢今晚唔得閒喎。", jyutping: "keoi5 waa6 keoi5 gam1 maan5 m4 dak1 haan4 wo5.", en: "She says she's busy tonight."}
    - {hanzi: "我原本想覆你，點知撳錯咗。", jyutping: "ngo5 jyun4 bun2 soeng2 fuk1 nei5, dim2 zi1 gam6 co3 zo2.", en: "I meant to reply to you, but I pressed the wrong button."}
    - {hanzi: "阿媽叫我得閒就聯絡吓佢。", jyutping: "aa3 maa1 giu3 ngo5 dak1 haan4 zau6 lyun4 lok3 haa5 keoi5.", en: "Mum tells me to get in touch with her when I'm free."}
    - {hanzi: "呢張相你send咗俾邊個？", jyutping: "ni1 zoeng1 soeng2 nei5 send zo2 bei2 bin1 go3?", en: "Who did you send this photo to?"}
    - {hanzi: "我哥哥平時好精神，今日唔知點解好攰。", jyutping: "ngo5 go4 go1 ping4 si4 hou2 zing1 san4, gam1 jat6 m4 zi1 dim2 gaai2 hou2 gui6.", en: "My brother is usually full of energy; I don't know why he's so tired today."}
  fill:
    - {hanzi: "蓮姐話你瘦咗___。", jyutping: "lin4 ze2 waa6 nei5 sau3 zo2 ___.", answer: "wo5", answer_hanzi: 喎, en: "Lin-ze says you've lost weight."}
    - {hanzi: "佢一個人住，又唔___去睇醫生。", jyutping: "keoi5 jat1 go3 jan4 zyu6, jau6 m4 ___ heoi3 tai2 ji1 sang1.", answer: "hang2", answer_hanzi: 肯, en: "He lives alone and won't go to the doctor."}
    - {hanzi: "你住喺佢樓上，幫我___佢啦。", jyutping: "nei5 zyu6 hai2 keoi5 lau4 soeng6, bong1 ngo5 ___ keoi5 laa1.", answer: "tai2 zyu6", answer_hanzi: 睇住, en: "You live above him; keep an eye on him for me."}
    - {hanzi: "呢度係家庭___嚟㗎！", jyutping: "ni1 dou6 hai6 gaa1 ting4 ___ lai4 gaa3!", answer: "kwan4 zou2", answer_hanzi: 群組, en: "This is a family group, you know!"}
    - {hanzi: "佢講嘅嘢一半係真，一半係佢自己___出嚟嘅。", jyutping: "keoi5 gong2 ge3 je5 jat1 bun3 hai6 zan1, jat1 bun3 hai6 keoi5 zi6 gei2 ___ ceot1 lai4 ge3.", answer: "zok3", answer_hanzi: 作, en: "Half of what she says is true, and half she makes up."}
