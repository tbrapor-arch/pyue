exercises:
  translate:
    - {hanzi: "我哋聽朝七點出發，夜晚先返嚟。", jyutping: "ngo5 dei6 ting1 ziu1 cat1 dim2 ceot1 faat3, je6 maan5 sin1 faan1 lai4.", en: "We set off at seven tomorrow morning and won't be back till evening."}
    - {hanzi: "坐喺窗口嗰個講普通話嘅人係我同事。", jyutping: "co5 hai2 coeng1 hau2 go2 go3 gong2 pou2 tung1 waa2 ge3 jan4 hai6 ngo5 tung4 si6.", en: "The person sitting by the window speaking Putonghua is my colleague."}
    - {hanzi: "呢條街好有特色，至少有一百年歷史。", jyutping: "ni1 tiu4 gaai1 hou2 jau5 dak6 sik1, zi3 siu2 jau5 jat1 baak3 nin4 lik6 si2.", en: "This street has real character; it's at least a hundred years old."}
    - {hanzi: "我喺沿途影咗好多相。", jyutping: "ngo5 hai2 jyun4 tou4 jing2 zo2 hou2 do1 soeng2.", en: "I took lots of photos along the way."}
    - {hanzi: "佢送咗張舊唱片俾我。", jyutping: "keoi5 sung3 zo2 zoeng1 gau6 coeng3 pin2 bei2 ngo5.", en: "He gave me an old record as a present."}
  fill:
    - {hanzi: "香港用___字，內地用簡體字。", jyutping: "hoeng1 gong2 jung6 ___ zi6, noi6 dei6 jung6 gaan2 tai2 zi6.", answer: "faan4 tai2", answer_hanzi: 繁體, en: "Hong Kong uses traditional characters, the mainland simplified ones."}
    - {hanzi: "我___張來回車票。", jyutping: "ngo5 ___ zoeng1 loi4 wui4 ce1 piu3.", answer: "maai5", answer_hanzi: 買, en: "I'll buy a return ticket."}
    - {hanzi: "冇人記得___樂隊，佢都有唱片。", jyutping: "mou5 jan4 gei3 dak1 ___ ngok6 deoi2, keoi5 dou1 jau5 coeng3 pin2.", answer: "ge3", answer_hanzi: 嘅, en: "He even has records by bands nobody remembers."}
    - {hanzi: "呢度係廣東話嘅___。", jyutping: "ni1 dou6 hai6 gwong2 dung1 waa2 ge3 ___.", answer: "lou5 gaa1", answer_hanzi: 老家, en: "This is Cantonese's home town."}
    - {hanzi: "一種語言要有人講，先可以___落去。", jyutping: "jat1 zung2 jyu5 jin4 jiu3 jau5 jan4 gong2, sin1 ho2 ji5 ___ lok6 heoi3.", answer: "sang1 cyun4", answer_hanzi: 生存, en: "A language needs people speaking it in order to survive."}
