exercises:
  translate:
    - {hanzi: "唔通你唔記得今日係我生日？", jyutping: "m4 tung1 nei5 m4 gei3 dak1 gam1 jat6 hai6 ngo5 saang1 jat6?", en: "Surely you haven't forgotten it's my birthday today?"}
    - {hanzi: "使乜咁客氣，我哋係屋企人。", jyutping: "sai2 mat1 gam3 haak3 hei3, ngo5 dei6 hai6 uk1 kei2 jan4.", en: "No need to be so polite; we're family."}
    - {hanzi: "佢一個人湊大三個仔女。", jyutping: "keoi5 jat1 go3 jan4 cau3 daai6 saam1 go3 zai2 neoi2.", en: "She brought up three children on her own."}
    - {hanzi: "我始終唔想放棄。", jyutping: "ngo5 ci2 zung1 m4 soeng2 fong3 hei3.", en: "In the end, I don't want to give up."}
    - {hanzi: "佢個女嘅字跡同佢一模一樣。", jyutping: "keoi5 go3 neoi2 ge3 zi6 zik1 tung4 keoi5 jat1 mou4 jat1 joeng6.", en: "His daughter's handwriting is exactly like his."}
  fill:
    - {hanzi: "___你以為我唔知咩？", jyutping: "___ nei5 ji5 wai4 ngo5 m4 zi1 me1?", answer: "m4 tung1", answer_hanzi: 唔通, en: "Do you really think I don't know?"}
    - {hanzi: "___一個人承擔晒？我哋可以幫你。", jyutping: "___ jat1 go3 jan4 sing4 daam1 saai3? ngo5 dei6 ho2 ji5 bong1 nei5.", answer: "sai2 mat1", answer_hanzi: 使乜, en: "Why carry it all alone? We can help you."}
    - {hanzi: "有啲說話我___講唔出。", jyutping: "jau5 di1 syut3 waa6 ngo5 ___ gong2 m4 ceot1.", answer: "dong1 min6", answer_hanzi: 當面, en: "There are things I can't say to your face."}
    - {hanzi: "我會一直___你。", jyutping: "ngo5 wui5 jat1 zik6 ___ nei5.", answer: "zi1 ci4", answer_hanzi: 支持, en: "I'll always support you."}
    - {hanzi: "佢想轉做___，一個禮拜返三日。", jyutping: "keoi5 soeng2 zyun3 zou6 ___, jat1 go3 lai5 baai3 faan1 saam1 jat6.", answer: "gim1 zik1", answer_hanzi: 兼職, en: "She wants to go part-time, three days a week."}
