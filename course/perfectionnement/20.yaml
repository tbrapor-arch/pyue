exercises:
  translate:
    - {hanzi: "呢首歌係我哋自己創作嘅，歌詞講我哋嘅生活。", jyutping: "ni1 sau2 go1 hai6 ngo5 dei6 zi6 gei2 cong3 zok3 ge3, go1 ci4 gong2 ngo5 dei6 ge3 sang1 wut6.", en: "We wrote this song ourselves; the lyrics are about our lives."}
    - {hanzi: "時代變咗，間茶餐廳依然喺度。", jyutping: "si4 doi6 bin3 zo2, gaan1 caa4 caan1 teng1 ji1 jin4 hai2 dou6.", en: "Times have changed, but the café is still there."}
    - {hanzi: "啲霓虹招牌一個二個拆晒。", jyutping: "di1 ngai4 hung4 ziu1 paai4 jat1 go3 ji6 go3 caak3 saai3.", en: "The neon signs have been taken down one after another."}
    - {hanzi: "我永遠唔會唔記得嗰個夜晚。", jyutping: "ngo5 wing5 jyun5 m4 wui5 m4 gei3 dak1 go2 go3 je6 maan5.", en: "I'll never forget that night."}
    - {hanzi: "司機，前面便利店有落，唔該！", jyutping: "si1 gei1, cin4 min6 bin6 lei6 dim3 jau5 lok6, m4 goi1!", en: "Driver, getting off at the convenience store ahead, please!"}
  fill:
    - {hanzi: "收音機___緊老歌。", jyutping: "sau1 jam1 gei1 ___ gan2 lou5 go1.", answer: "bo3", answer_hanzi: 播, en: "The radio is playing old songs."}
    - {hanzi: "最後一班紅van，___住成車人。", jyutping: "zeoi3 hau6 jat1 baan1 hung4 van, ___ zyu6 seng4 ce1 jan4.", answer: "zoi3", answer_hanzi: 載, en: "The last red minibus, carrying a busload of people."}
    - {hanzi: "佢啱啱___，我啱啱收工。", jyutping: "keoi5 ngaam1 ngaam1 ___, ngo5 ngaam1 ngaam1 sau1 gung1.", answer: "hoi1 gung1", answer_hanzi: 開工, en: "He's just started work, I've just finished."}
    - {hanzi: "我嘅___未講完。", jyutping: "ngo5 ge3 ___ mei6 gong2 jyun4.", answer: "gu3 si6", answer_hanzi: 故事, en: "My story isn't finished yet."}
    - {hanzi: "條街___唔會空。", jyutping: "tiu4 gaai1 ___ m4 wui5 hung1.", answer: "wing5 jyun5", answer_hanzi: 永遠, en: "The street will never be empty."}
