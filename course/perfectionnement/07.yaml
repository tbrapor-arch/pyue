exercises:
  translate:
    - {hanzi: "我睇你咁得閒，不如落嚟幫手啦。", jyutping: "ngo5 tai2 nei5 gam3 dak1 haan4, bat1 jyu4 lok6 lai4 bong1 sau2 laa1.", en: "Seeing you've got so much time, why don't you come down and help?"}
    - {hanzi: "佢忙到連晚飯都冇時間食。", jyutping: "keoi5 mong4 dou3 lin4 maan5 faan6 dou1 mou5 si4 gaan3 sik6.", en: "She's so busy she doesn't even have time for dinner."}
    - {hanzi: "加租嘅事，我哋未收到信。", jyutping: "gaa1 zou1 ge3 si6, ngo5 dei6 mei6 sau1 dou2 seon3.", en: "As for the rent rise, we haven't received a letter yet."}
    - {hanzi: "啲同事話佢上電台講得好好喎。", jyutping: "di1 tung4 si6 waa6 keoi5 soeng5 din6 toi4 gong2 dak1 hou2 hou2 wo5.", en: "My colleagues say he did very well on the radio."}
    - {hanzi: "總好過喺屋企坐成日。", jyutping: "zung2 hou2 gwo3 hai2 uk1 kei2 co5 seng4 jat6.", en: "Anything's better than sitting at home all day."}
  fill:
    - {hanzi: "我而家乜都冇做，不過有啲___。", jyutping: "ngo5 ji4 gaa1 mat1 dou1 mou5 zou6, bat1 gwo3 jau5 di1 ___.", answer: "cyu5 cuk1", answer_hanzi: 儲蓄, en: "I'm not doing anything now, but I have some savings."}
    - {hanzi: "我睇你咁得閒，___朝早落嚟幫手。", jyutping: "ngo5 tai2 nei5 gam3 dak1 haan4, ___ ziu1 zou2 lok6 lai4 bong1 sau2.", answer: "bat1 jyu4", answer_hanzi: 不如, en: "Seeing you've got so much time, why not come down and help in the mornings?"}
    - {hanzi: "如果真係加一倍，我___有加價。", jyutping: "jyu4 gwo2 zan1 hai6 gaa1 jat1 pui5, ngo5 ___ jau5 gaa1 gaa3.", answer: "wai4", answer_hanzi: 唯, en: "If it really doubles, I'll have no choice but to raise prices."}
    - {hanzi: "佢細個嗰陣時淨係___食蛋撻。", jyutping: "keoi5 sai3 go3 go2 zan6 si4 zing6 hai6 ___ sik6 daan6 taat1.", answer: "sik1", answer_hanzi: 識, en: "When she was little, all she knew was eating egg tarts."}
    - {hanzi: "唔好___亂講，我有搵工㗎。", jyutping: "m4 hou2 ___ lyun6 gong2, ngo5 jau5 wan2 gung1 gaa3.", answer: "zoi3", answer_hanzi: 再, en: "Stop talking nonsense, I am looking for a job."}
