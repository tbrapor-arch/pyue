exercises:
  translate:
    - {hanzi: "如果佢今晚喺度，佢實好開心。", jyutping: "jyu4 gwo2 keoi5 gam1 maan5 hai2 dou6, keoi5 sat6 hou2 hoi1 sam1.", en: "If he were here tonight, he'd surely be very happy."}
    - {hanzi: "就算冇客，都要沖奶茶。", jyutping: "zau6 syun3 mou5 haak3, dou1 jiu3 cung1 naai5 caa4.", en: "Even with no customers, the milk tea gets made."}
    - {hanzi: "我老咗，應該交棒喇。", jyutping: "ngo5 lou5 zo2, jing1 goi1 gaau1 paang5 laa3.", en: "I'm old; it's time to hand over."}
    - {hanzi: "我一開始唔敢信佢。", jyutping: "ngo5 jat1 hoi1 ci2 m4 gam2 seon3 keoi5.", en: "At first I didn't dare trust him."}
    - {hanzi: "大家舉杯，祝大家身體健康！", jyutping: "daai6 gaa1 geoi2 bui1, zuk1 daai6 gaa1 san1 tai2 gin6 hong1!", en: "Raise your cups: to everyone's health!"}
  fill:
    - {hanzi: "做生意唔___聰明，但係一定要守信用。", jyutping: "zou6 saang1 ji3 m4 ___ cung1 ming4, daan6 hai6 jat1 ding6 jiu3 sau2 seon3 jung6.", answer: "sai2", answer_hanzi: 使, en: "You don't need to be clever to do business, but you must keep your word."}
    - {hanzi: "我___係要多謝佢。", jyutping: "ngo5 ___ hai6 jiu3 do1 ze6 keoi5.", answer: "gang2", answer_hanzi: 梗, en: "Of course I have to thank him."}
    - {hanzi: "佢諗法好多，但係我___佢。", jyutping: "keoi5 nam2 faat3 hou2 do1, daan6 hai6 ngo5 ___ keoi5.", answer: "seon3 jam6", answer_hanzi: 信任, en: "She has lots of ideas, but I trust her."}
    - {hanzi: "一九七二年，我先父___梁記。", jyutping: "jat1 gau2 cat1 ji6 nin4, ngo5 sin1 fu6 ___ loeng4 gei3.", answer: "cong3 baan6", answer_hanzi: 創辦, en: "In 1972 my late father founded 梁記."}
    - {hanzi: "你___唔敢上天台唱歌？", jyutping: "nei5 ___ m4 gam2 soeng5 tin1 toi4 coeng3 go1?", answer: "gam2", answer_hanzi: 敢, en: "Do you dare go up to the roof and sing?"}
