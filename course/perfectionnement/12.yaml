exercises:
  translate:
    - {hanzi: "佢哋冚唪唥都去咗台灣旅行。", jyutping: "keoi5 dei6 ham6 baang6 laang6 dou1 heoi3 zo2 toi4 waan1 leoi5 hang4.", en: "All of them have gone on holiday to Taiwan."}
    - {hanzi: "佢哋下個月喺工廈表演，有好多首新歌。", jyutping: "keoi5 dei6 haa6 go3 jyut6 hai2 gung1 haa6 biu2 jin2, jau5 hou2 do1 sau2 san1 go1.", en: "They're playing in a factory building next month, with lots of new songs."}
    - {hanzi: "佢竟然識彈結他，我以為佢淨係識唱歌。", jyutping: "keoi5 ging2 jin4 sik1 taan4 git3 taa1, ngo5 ji5 wai4 keoi5 zing6 hai6 sik1 coeng3 go1.", en: "She can actually play the guitar; I thought she could only sing."}
    - {hanzi: "我哋個鼓手打鼓好大力，不過邊個都唔介意。", jyutping: "ngo5 dei6 go3 gu2 sau2 daa2 gu2 hou2 daai6 lik6, bat1 gwo3 bin1 go3 dou1 m4 gaai3 ji3.", en: "Our drummer hits the drums really hard, but none of us minds."}
    - {hanzi: "樓上嘈到我成晚瞓唔着。", jyutping: "lau4 soeng6 cou4 dou3 ngo5 seng4 maan5 fan3 m4 zoek6.", en: "Upstairs was so noisy I couldn't sleep all night."}
  fill:
    - {hanzi: "我___都識少少，不過乜都唔精。", jyutping: "ngo5 ___ dou1 sik1 siu2 siu2, bat1 gwo3 mat1 dou1 m4 zing1.", answer: "mat1", answer_hanzi: 乜, en: "I know a bit of everything, but I'm not good at anything."}
    - {hanzi: "唔好___喇，快啲開始啦。", jyutping: "m4 hou2 ___ laa3, faai3 di1 hoi1 ci2 laa1.", answer: "ceoi1 seoi2", answer_hanzi: 吹水, en: "Stop chatting, let's start."}
    - {hanzi: "你哋兩個咁___，不如一齊夾band。", jyutping: "nei5 dei6 loeng5 go3 gam3 ___, bat1 jyu4 jat1 cai4 gaap3 band.", answer: "gaap3", answer_hanzi: 夾, en: "You two get on so well, why not start a band together?"}
    - {hanzi: "我笑___肚痛。", jyutping: "ngo5 siu3 ___ tou5 tung3.", answer: "dou3", answer_hanzi: 到, en: "I laughed till my stomach hurt."}
    - {hanzi: "個個都舉咗手，即係你___咗我哋個樂隊。", jyutping: "go3 go3 dou1 geoi2 zo2 sau2, zik1 hai6 nei5 ___ zo2 ngo5 dei6 go3 ngok6 deoi2.", answer: "gaa1 jap6", answer_hanzi: 加入, en: "Everyone's put their hand up, which means you've joined our band."}
