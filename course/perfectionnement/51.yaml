exercises:
  translate:
    - {hanzi: "我俾雨淋到成身濕。", jyutping: "ngo5 bei2 jyu5 lam4 dou3 seng4 san1 sap1.", en: "I got soaked through by the rain."}
    - {hanzi: "我把遮俾風吹走咗。", jyutping: "ngo5 baa2 ze1 bei2 fung1 ceoi1 zau2 zo2.", en: "My umbrella got blown away by the wind."}
    - {hanzi: "你怕唔怕黑？", jyutping: "nei5 paa3 m4 paa3 hak1?", en: "Are you afraid of the dark?"}
    - {hanzi: "停電，啲燈熄晒。", jyutping: "ting4 din6, di1 dang1 sik1 saai3.", en: "Power cut: all the lights are out."}
    - {hanzi: "我哋輪流問，唔准講大話。", jyutping: "ngo5 dei6 leon4 lau4 man6, m4 zeon2 gong2 daai6 waa6.", en: "We take turns asking; no lying allowed."}
  fill:
    - {hanzi: "我啲金魚實___行雷嚇親。", jyutping: "ngo5 di1 gam1 jyu2 sat6 ___ haang4 leoi4 haak3 can1.", answer: "bei2", answer_hanzi: 俾, en: "My goldfish must be frightened by the thunder."}
    - {hanzi: "冇電，雪櫃啲凍肉就___晒。", jyutping: "mou5 din6, syut3 gwai6 di1 dung3 juk6 zau6 ___ saai3.", answer: "jung4", answer_hanzi: 溶, en: "With no power, the frozen meat in the fridge will all thaw."}
    - {hanzi: "你份合約，續___唔續？", jyutping: "nei5 fan6 hap6 joek3, zuk6 ___ m4 zuk6?", answer: "ding6", answer_hanzi: 定, en: "Your contract: renewing or not?"}
    - {hanzi: "唱___唱，我唔怕。", jyutping: "coeng3 ___ coeng3, ngo5 m4 paa3.", answer: "zau6", answer_hanzi: 就, en: "Fine, I'll sing; I'm not afraid."}
    - {hanzi: "佢一放手就___晒。", jyutping: "keoi5 jat1 fong3 sau2 zau6 ___ saai3.", answer: "min6 hung4", answer_hanzi: 面紅, en: "As soon as she let go, she blushed."}
