exercises:
  translate:
    - {hanzi: "佢靜靜雞咁出咗門口。", jyutping: "keoi5 zing6 zing2 gai1 gam2 ceot1 zo2 mun4 hau2.", en: "She slipped out quietly."}
    - {hanzi: "我一返到屋企，佢就鬧我。", jyutping: "ngo5 jat1 faan1 dou3 uk1 kei2, keoi5 zau6 naau6 ngo5.", en: "The moment I got home, he told me off."}
    - {hanzi: "佢哋兩父子冷戰咗兩年。", jyutping: "keoi5 dei6 loeng5 fu6 zi2 laang5 zin3 zo2 loeng5 nin4.", en: "Father and son didn't speak to each other for two years."}
    - {hanzi: "佢唔後悔當年嘅決定。", jyutping: "keoi5 m4 hau6 fui3 dong1 nin4 ge3 kyut3 ding6.", en: "She doesn't regret her decision back then."}
    - {hanzi: "國安法生效之後，好多團體解散。", jyutping: "gwok3 on1 faat3 sang1 haau6 zi1 hau6, hou2 do1 tyun4 tai2 gaai2 saan3.", en: "After the National Security Law took effect, many groups disbanded."}
  fill:
    - {hanzi: "佢慢慢___行入房。", jyutping: "keoi5 maan6 maan2 ___ haang4 jap6 fong2.", answer: "gam2", answer_hanzi: 咁, en: "He walked slowly into his room."}
    - {hanzi: "一九六七年暴動___，我都係你咁上下年紀。", jyutping: "jat1 gau2 luk6 cat1 nin4 bou6 dung6 ___, ngo5 dou1 hai6 nei5 gam3 soeng6 haa2 nin4 gei2.", answer: "ge3 si4 hau6", answer_hanzi: 嘅時候, en: "During the 1967 riots I was about your age."}
    - {hanzi: "佢俾人___，罪名係暴動。", jyutping: "keoi5 bei2 jan4 ___, zeoi6 ming4 hai6 bou6 dung6.", answer: "keoi1 bou6", answer_hanzi: 拘捕, en: "He was arrested and charged with rioting."}
    - {hanzi: "而家冇人再___，好似冇發生過咁。", jyutping: "ji4 gaa1 mou5 jan4 zoi3 ___, hou2 ci5 mou5 faat3 sang1 gwo3 gam2.", answer: "tai4 hei2", answer_hanzi: 提起, en: "Nobody mentions it any more, as if it never happened."}
    - {hanzi: "佢想___我唔好去。", jyutping: "keoi5 soeng2 ___ ngo5 m4 hou2 heoi3.", answer: "hyun3", answer_hanzi: 勸, en: "She wanted to persuade me not to go."}
