exercises:
  translate:
    - {hanzi: "我去過澳門三次，次次都輸錢。", jyutping: "ngo5 heoi3 gwo3 ou3 mun2 saam1 ci3, ci3 ci3 dou1 syu1 cin2.", en: "I've been to Macau three times and lost money every time."}
    - {hanzi: "食完飯，我哋去海邊行一轉。", jyutping: "sik6 jyun4 faan6, ngo5 dei6 heoi3 hoi2 bin1 haang4 jat1 zyun3.", en: "After dinner, let's take a stroll by the sea."}
    - {hanzi: "阿媽知道咗，實鬧我一餐。", jyutping: "aa3 maa1 zi1 dou3 zo2, sat6 naau6 ngo5 jat1 caan1.", en: "When Mum finds out, she'll give me a good telling-off."}
    - {hanzi: "佢跑得最快，最後仍然輸咗。", jyutping: "keoi5 paau2 dak1 zeoi3 faai3, zeoi3 hau6 jing4 jin4 syu1 zo2.", en: "He ran the fastest, but in the end he still lost."}
    - {hanzi: "唔好求其揀，睇吓馬經先。", jyutping: "m4 hou2 kau4 kei4 gaan2, tai2 haa5 maa5 ging1 sin1.", en: "Don't just pick any old one; read the form guide first."}
  fill:
    - {hanzi: "呢隻馬今季贏過三___。", jyutping: "ni1 zek3 maa5 gam1 gwai3 jeng4 gwo3 saam1 ___.", answer: "ci3", answer_hanzi: 次, en: "This horse has won three times this season."}
    - {hanzi: "今晚第七___，大熱係「醒目仔」。", jyutping: "gam1 maan5 dai6 cat1 ___, daai6 jit6 hai6 \"sing2 muk6 zai2\".", answer: "coeng4", answer_hanzi: 場, en: "In tonight's race seven, the favourite is 'Smart Kid'."}
    - {hanzi: "我請你食一___宵夜。", jyutping: "ngo5 ceng2 nei5 sik6 jat1 ___ siu1 je2.", answer: "caan1", answer_hanzi: 餐, en: "I'll treat you to a late-night snack."}
    - {hanzi: "佢喺最後五十米___上咗。", jyutping: "keoi5 hai2 zeoi3 hau6 ng5 sap6 mai5 ___ soeng5 zo2.", answer: "zeoi1", answer_hanzi: 追, en: "It caught up in the last fifty metres."}
    - {hanzi: "冇人睇好佢，結果___！", jyutping: "mou5 jan4 tai2 hou2 keoi5, git3 gwo2 ___!", answer: "baau3 laang5", answer_hanzi: 爆冷, en: "Nobody fancied it, and it won: an upset!"}
