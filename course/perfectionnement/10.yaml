exercises:
  translate:
    - {hanzi: "佢咁晏都未返嚟，應該塞車啩。", jyutping: "keoi5 gam3 aan3 dou1 mei6 faan1 lai4, jing1 goi1 sak1 ce1 gwaa3.", en: "He's still not back this late; must be stuck in traffic, I guess."}
    - {hanzi: "你阿媽知道你辭咗職，實好嬲。", jyutping: "nei5 aa3 maa1 zi1 dou3 nei5 ci4 zo2 zik1, sat6 hou2 nau1.", en: "When your mum finds out you've quit, she'll surely be upset."}
    - {hanzi: "我覺得佢性格好好，又有耐性又搞笑。", jyutping: "ngo5 gok3 dak1 keoi5 sing3 gaak3 hou2 hou2, jau6 jau5 noi6 sing3 jau6 gaau2 siu3.", en: "I think she has a great personality: patient and funny."}
    - {hanzi: "呢間舖可以代表成個深水埗。", jyutping: "ni1 gaan1 pou3 ho2 ji5 doi6 biu2 seng4 go3 sam1 seoi2 bou2.", en: "This shop could stand for the whole of Sham Shui Po."}
    - {hanzi: "等陣住，我未準備好。", jyutping: "dang2 zan6 zyu6, ngo5 mei6 zeon2 bei6 hou2.", en: "Hang on, I'm not ready yet."}
  fill:
    - {hanzi: "佢個樣好___，其實好好人。", jyutping: "keoi5 go3 joeng2 hou2 ___, kei4 sat6 hou2 hou2 jan4.", answer: "hung1", answer_hanzi: 兇, en: "He looks fierce, but he's actually really nice."}
    - {hanzi: "我哋___咗佢做「阿果」。", jyutping: "ngo5 dei6 ___ zo2 keoi5 zou6 \"aa3 gwo2\".", answer: "giu3", answer_hanzi: 叫, en: "We've started calling him 'A-Gwo'."}
    - {hanzi: "呢段講得太長，不如___短啲。", jyutping: "ni1 dyun6 gong2 dak1 taai3 coeng4, bat1 jyu4 ___ dyun2 di1.", answer: "zin2", answer_hanzi: 剪, en: "This bit is too long; why not cut it shorter?"}
    - {hanzi: "佢喺隔籬住咗十年，___係我哋嘅老街坊。", jyutping: "keoi5 hai2 gaak3 lei4 zyu6 zo2 sap6 nin4, ___ hai6 ngo5 dei6 ge3 lou5 gaai1 fong1.", answer: "syun3", answer_hanzi: 算, en: "He's lived next door for ten years; he counts as one of our old neighbours."}
    - {hanzi: "___，我淨係睇過電影，冇睇過本書。", jyutping: "___, ngo5 zing6 hai6 tai2 gwo3 din6 jing2, mou5 tai2 gwo3 bun2 syu1.", answer: "lou5 sat6 gong2", answer_hanzi: 老實講, en: "To be honest, I've only seen the film, not read the book."}
