exercises:
  translate:
    - {hanzi: "你唔食呀？— 係，我唔肚餓。", jyutping: "nei5 m4 sik6 aa4? — hai6, ngo5 m4 tou5 ngo6.", en: "Aren't you eating? — No, I'm not hungry."}
    - {hanzi: "你冇去過長洲呀？— 唔係，我去過兩次。", jyutping: "nei5 mou5 heoi3 gwo3 coeng4 zau1 aa4? — m4 hai6, ngo5 heoi3 gwo3 loeng5 ci3.", en: "Haven't you been to Cheung Chau? — Yes, I've been twice."}
    - {hanzi: "啲焦糖燶咗，好苦。", jyutping: "di1 ziu1 tong4 nung1 zo2, hou2 fu2.", en: "The caramel's burnt; it's very bitter."}
    - {hanzi: "影相嗰陣自然啲，微笑吓。", jyutping: "jing2 soeng2 go2 zan6 zi6 jin4 di1, mei4 siu3 haa5.", en: "Be a bit more natural when we take the photo; smile."}
    - {hanzi: "我哋要拍硬檔，唔好甩轆。", jyutping: "ngo5 dei6 jiu3 paak3 ngaang6 dong3, m4 hou2 lat1 luk1.", en: "We have to pull together and not mess it up."}
  fill:
    - {hanzi: "你唔緊張呀？— ___，我唔緊張。", jyutping: "nei5 m4 gan2 zoeng1 aa4? — ___, ngo5 m4 gan2 zoeng1.", answer: "hai6", answer_hanzi: 係, en: "Aren't you nervous? — No, I'm not."}
    - {hanzi: "你冇用過火槍呀？— ___，我用過。", jyutping: "nei5 mou5 jung6 gwo3 fo2 coeng1 aa4? — ___, ngo5 jung6 gwo3.", answer: "m4 hai6", answer_hanzi: 唔係, en: "Haven't you used a blowtorch? — Yes, I have."}
    - {hanzi: "打蛋，加牛奶，___，再蒸。", jyutping: "daa2 daan2, gaa1 ngau4 naai5, ___, zoi3 zing1.", answer: "gaau2 wan4", answer_hanzi: 攪勻, en: "Beat the eggs, add milk, stir till smooth, then steam."}
    - {hanzi: "佢一對住鏡頭就___。", jyutping: "keoi5 jat1 deoi3 zyu6 geng3 tau4 zau6 ___.", answer: "baan2 hei2 faai3 min6", answer_hanzi: 板起塊面, en: "The moment he faces the camera, he goes stony-faced."}
    - {hanzi: "我沖咗五十年奶茶，好有___。", jyutping: "ngo5 cung1 zo2 ng5 sap6 nin4 naai5 caa4, hou2 jau5 ___.", answer: "seon3 sam1", answer_hanzi: 信心, en: "I've made milk tea for fifty years; I'm very confident."}
