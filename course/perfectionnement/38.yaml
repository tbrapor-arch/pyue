exercises:
  translate:
    - {hanzi: "每個參賽者都要簽同意書。", jyutping: "mui5 go3 caam1 coi3 ze2 dou1 jiu3 cim1 tung4 ji3 syu1.", en: "Every entrant has to sign a consent form."}
    - {hanzi: "所有嘢食都要喺現場整。", jyutping: "so2 jau5 je5 sik6 dou1 jiu3 hai2 jin6 coeng4 zing2.", en: "All the food has to be made on site."}
    - {hanzi: "佢任何嘢都唔食。", jyutping: "keoi5 jam6 ho4 je5 dou1 m4 sik6.", en: "He won't eat anything."}
    - {hanzi: "超過時間嘅隊一律扣分。", jyutping: "ciu1 gwo3 si4 gaan3 ge3 deoi2 jat1 leot6 kau3 fan1.", en: "Teams that go over time lose points, without exception."}
    - {hanzi: "我哋入圍咗決賽！", jyutping: "ngo5 dei6 jap6 wai4 zo2 kyut3 coi3!", en: "We've made it to the final!"}
  fill:
    - {hanzi: "___間分店都用同一個大廚房。", jyutping: "___ gaan1 fan1 dim3 dou1 jung6 tung4 jat1 go3 daai6 cyu4 fong2.", answer: "mui5", answer_hanzi: 每, en: "Every branch uses the same big kitchen."}
    - {hanzi: "任何新諗法我___想試。", jyutping: "jam6 ho4 san1 nam2 faat3 ngo5 ___ soeng2 si3.", answer: "dou1", answer_hanzi: 都, en: "I want to try any new idea."}
    - {hanzi: "味道___百分之四十。", jyutping: "mei6 dou6 ___ baak3 fan6 zi1 sei3 sap6.", answer: "zim3", answer_hanzi: 佔, en: "Taste counts for forty per cent."}
    - {hanzi: "梁記開咗五十幾年，梗係夠___。", jyutping: "loeng4 gei3 hoi1 zo2 ng5 sap6 gei2 nin4, gang2 hai6 gau3 ___.", answer: "zi1 gaak3", answer_hanzi: 資格, en: "梁記 has been open fifty-odd years; of course it qualifies."}
    - {hanzi: "評審嘅決定係___決定。", jyutping: "ping4 sam2 ge3 kyut3 ding6 hai6 ___ kyut3 ding6.", answer: "zeoi3 zung1", answer_hanzi: 最終, en: "The judges' decision is final."}
