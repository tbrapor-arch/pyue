exercises:
  translate:
    - {hanzi: "我尋日俾雨淋到成身濕。", jyutping: "ngo5 cam4 jat6 bei2 jyu5 lam4 dou3 seng4 san1 sap1.", en: "Yesterday I got soaked through by the rain."}
    - {hanzi: "佢俾人呃咗兩萬蚊。", jyutping: "keoi5 bei2 jan4 aak1 zo2 loeng5 maan6 man1.", en: "He was cheated out of twenty thousand dollars."}
    - {hanzi: "回南天，啲地板黐立立。", jyutping: "wui4 naam4 tin1, di1 dei6 baan2 ci1 nap6 nap6.", en: "It's the damp season; the floor is all sticky."}
    - {hanzi: "梁記決定參加茶餐廳比賽。", jyutping: "loeng4 gei3 kyut3 ding6 caam1 gaa1 caa4 caan1 teng1 bei2 coi3.", en: "梁記 has decided to enter the cha chaan teng contest."}
    - {hanzi: "不少老店因租金上升而結業。", jyutping: "bat1 siu2 lou5 dim3 jan1 zou1 gam1 soeng5 sing1 ji4 git3 jip6.", en: "Quite a few old shops have closed because of rising rents."}
  fill:
    - {hanzi: "三名乘客受傷，___送往醫院。", jyutping: "saam1 ming4 sing4 haak3 sau6 soeng1, ___ sung3 wong5 ji1 jyun2.", answer: "bei6", answer_hanzi: 被, en: "Three passengers were injured and taken to hospital."}
    - {hanzi: "我___蚊咬到成手都係。", jyutping: "ngo5 ___ man1 ngaau5 dou3 seng4 sau2 dou1 hai6.", answer: "bei2", answer_hanzi: 俾, en: "My whole arm is covered in mosquito bites."}
    - {hanzi: "請於四月三十日或之前___。", jyutping: "cing2 jyu1 sei3 jyut6 saam1 sap6 jat6 waak6 zi1 cin4 ___.", answer: "bou3 meng2", answer_hanzi: 報名, en: "Please register on or before 30 April."}
    - {hanzi: "冠軍可以攞十萬蚊___。", jyutping: "gun3 gwan1 ho2 ji5 lo2 sap6 maan6 man1 ___.", answer: "zoeng2 gam1", answer_hanzi: 獎金, en: "The winner gets a hundred thousand dollars in prize money."}
    - {hanzi: "Ken 今日放假，喺屋企___。", jyutping: "Ken gam1 jat6 fong3 gaa3, hai2 uk1 kei2 ___.", answer: "daa2 gei1", answer_hanzi: 打機, en: "Ken is off today, playing video games at home."}
