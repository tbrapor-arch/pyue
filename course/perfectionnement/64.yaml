exercises:
  translate:
    - {hanzi: "佢好細聲咁講早晨。", jyutping: "keoi5 hou2 sai3 seng1 gam2 gong2 zou2 san4.", en: "He said good morning very quietly."}
    - {hanzi: "笑笑口咁講，有自信啲。", jyutping: "siu3 siu3 hau2 gam2 gong2, jau5 zi6 seon3 di1.", en: "Say it with a smile, more confidently."}
    - {hanzi: "佢好害羞，唔肯演侍應。", jyutping: "keoi5 hou2 hoi6 sau1, m4 hang2 jin2 si6 jing3.", en: "He's very shy and won't play the waiter."}
    - {hanzi: "喺法國唔使俾好多小費。", jyutping: "hai2 faat3 gwok3 m4 sai2 bei2 hou2 do1 siu2 fai3.", en: "In France you don't need to tip much."}
    - {hanzi: "最緊要係繼續講落去。", jyutping: "zeoi3 gan2 jiu3 hai6 gai3 zuk6 gong2 lok6 heoi3.", en: "What matters is that you keep going."}
  fill:
    - {hanzi: "佢慢慢___行開。", jyutping: "keoi5 maan6 maan2 ___ haang4 hoi1.", answer: "gam2", answer_hanzi: 咁, en: "He slowly walked off."}
    - {hanzi: "你個發音最好，___侍應啱晒你。", jyutping: "nei5 go3 faat3 jam1 zeoi3 hou2, ___ si6 jing3 ngaam1 saai3 nei5.", answer: "baan6 jin2", answer_hanzi: 扮演, en: "Your pronunciation is the best; playing the waiter suits you perfectly."}
    - {hanzi: "佢唔記得對白，我細聲___。", jyutping: "keoi5 m4 gei3 dak1 deoi3 baak6, ngo5 sai3 seng1 ___.", answer: "tai4 ci4", answer_hanzi: 提詞, en: "He forgot his line, so I prompted him quietly."}
    - {hanzi: "呢度就係文化___。", jyutping: "ni1 dou6 zau6 hai6 man4 faa3 ___.", answer: "caa1 ji6", answer_hanzi: 差異, en: "That's the cultural difference."}
    - {hanzi: "你哋個個都要嚟，開開___咁演。", jyutping: "nei5 dei6 go3 go3 dou1 jiu3 lai4, hoi1 hoi1 ___ gam2 jin2.", answer: "sam1 sam1", answer_hanzi: 心心, en: "You're all coming, and you'll perform happily."}
