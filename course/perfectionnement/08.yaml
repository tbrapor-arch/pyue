exercises:
  translate:
    - {hanzi: "將本書擺返上枱。", jyutping: "zoeng1 bun2 syu1 baai2 faan1 soeng5 toi2.", en: "Put the book back on the table."}
    - {hanzi: "用滾水沖一沖啲筷子先。", jyutping: "jung6 gwan2 seoi2 cung1 jat1 cung1 di1 faai3 zi2 sin1.", en: "Rinse the chopsticks with boiling water first."}
    - {hanzi: "你攞杯奶茶去三號枱。", jyutping: "nei5 lo2 bui1 naai5 caa4 heoi3 saam1 hou6 toi2.", en: "Take a milk tea to table three."}
    - {hanzi: "我喺度等咗你成個鐘頭。", jyutping: "ngo5 hai2 dou6 dang2 zo2 nei5 seng4 go3 zung1 tau4.", en: "I've been waiting here for you for a whole hour."}
    - {hanzi: "啲奶同茶要撈勻先好飲。", jyutping: "di1 naai5 tung4 caa4 jiu3 lou1 wan4 sin1 hou2 jam2.", en: "The milk and the tea have to be mixed evenly to taste good."}
  fill:
    - {hanzi: "___啲茶葉放入茶袋，再放入茶煲。", jyutping: "___ di1 caa4 jip6 fong3 jap6 caa4 doi2, zoi3 fong3 jap6 caa4 bou1.", answer: "zoeng1", answer_hanzi: 將, en: "Put the tea leaves into the bag, then into the pot."}
    - {hanzi: "新茶袋用得耐，就會___啡色。", jyutping: "san1 caa4 doi2 jung6 dak1 noi6, zau6 wui5 ___ fe1 sik1.", answer: "bin3", answer_hanzi: 變, en: "Use a new tea bag long enough and it turns brown."}
    - {hanzi: "杯唔熱，要擺喺熱水度___住。", jyutping: "bui1 m4 jit6, jiu3 baai2 hai2 jit6 seoi2 dou6 ___ zyu6.", answer: "wan1", answer_hanzi: 溫, en: "If the cups aren't hot, stand them in hot water to keep warm."}
    - {hanzi: "咪成日___嘴，聽我講先！", jyutping: "mai5 seng4 jat6 ___ zeoi2, teng1 ngo5 gong2 sin1!", answer: "bok3", answer_hanzi: 駁, en: "Stop talking back all the time and listen to me first!"}
    - {hanzi: "洗茶袋要用清水，千祈唔好用___。", jyutping: "sai2 caa4 doi2 jiu3 jung6 cing1 seoi2, cin1 kei4 m4 hou2 jung6 ___.", answer: "faan1 gaan2", answer_hanzi: 番梘, en: "Wash the tea bag in clean water, and never use soap."}
