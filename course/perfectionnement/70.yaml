    - {hanzi: "你個燉蛋好滑過我整嘅。", jyutping: "nei5 go3 dan6 daan2 hou2 waat6 gwo3 ngo5 zing2 ge3.", en: "Your custard is smoother than mine."}
    - {hanzi: "英國啲茶冇咁濃。", jyutping: "jing1 gwok3 di1 caa4 mou5 gam3 nung4.", en: "English tea isn't as strong."}
