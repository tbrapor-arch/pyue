    - {hanzi: "落雨收柴，係時候收工喇。", jyutping: "lok6 jyu5 sau1 caai4, hai6 si4 hau6 sau1 gung1 laa3.", en: "Time to bring in the firewood: time to call it a day."}
  fill:
    - {hanzi: "如果你想___，我再續約。", jyutping: "jyu4 gwo2 nei5 soeng2 ___, ngo5 zoi3 zuk6 joek3.", answer: "ge3 waa2", answer_hanzi: 嘅話, en: "If you like, I'll renew the lease."}
    - {hanzi: "你___想佢做你個孫，唔要我？", jyutping: "nei5 ___ soeng2 keoi5 zou6 nei5 go3 syun1, m4 jiu3 ngo5?", answer: "m4 tung1", answer_hanzi: 唔通, en: "Don't tell me you'd rather have him as your grandchild?"}
    - {hanzi: "唔好學我___硬頸。", jyutping: "m4 hou2 hok6 ngo5 ___ ngaang6 geng2.", answer: "gam3", answer_hanzi: 咁, en: "Don't be as stubborn as me."}
    - {hanzi: "我哋___有十年一齊飲茶。", jyutping: "ngo5 dei6 ___ jau5 sap6 nin4 jat1 cai4 jam2 caa4.", answer: "zung6", answer_hanzi: 仲, en: "We still have ten years of tea together."}
    - {hanzi: "今年，我都___屋企人。", jyutping: "gam1 nin4, ngo5 dou1 ___ uk1 kei2 jan4.", answer: "hai6", answer_hanzi: 係, en: "This year, I'm family too."}
