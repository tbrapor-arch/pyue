exercises:
  translate:
    - {hanzi: "唔使急，慢慢行。", jyutping: "m4 sai2 gap1, maan6 maan2 haang4.", en: "No hurry, walk slowly."}
    - {hanzi: "我要唞吓氣先，對腳軟晒。", jyutping: "ngo5 jiu3 tau2 haa5 hei3 sin1, deoi3 goek3 jyun5 saai3.", en: "I need to catch my breath first; my legs have gone to jelly."}
    - {hanzi: "我專登早啲起身，去山頂睇日出。", jyutping: "ngo5 zyun1 dang1 zou2 di1 hei2 san1, heoi3 saan1 deng2 tai2 jat6 ceot1.", en: "I got up early on purpose to watch the sunrise from the top."}
    - {hanzi: "佢講得清清楚楚，個個都明。", jyutping: "keoi5 gong2 dak1 cing1 cing1 co2 co2, go3 go3 dou1 ming4.", en: "She explained it very clearly; everyone understood."}
    - {hanzi: "行完山，飲枝凍冰冰嘅汽水，最正！", jyutping: "haang4 jyun4 saan1, jam2 zi1 dung3 bing1 bing1 ge3 hei3 seoi2, zeoi3 zeng3!", en: "After a hike, an ice-cold fizzy drink is the best!"}
  fill:
    - {hanzi: "個海___哋，好靚。", jyutping: "go3 hoi2 ___ dei2, hou2 leng3.", answer: "laam4 laam4", answer_hanzi: 藍藍, en: "The sea is a lovely blue."}
    - {hanzi: "最緊要開開___行完。", jyutping: "zeoi3 gan2 jiu3 hoi1 hoi1 ___ haang4 jyun4.", answer: "sam1 sam1", answer_hanzi: 心心, en: "What matters is finishing happily."}
    - {hanzi: "佢細___個就成日行山。", jyutping: "keoi5 sai3 ___ go3 zau6 sing4 jat6 haang4 saan1.", answer: "sai3", answer_hanzi: 細, en: "She's been hiking since she was tiny."}
    - {hanzi: "我___咗早起身，唔覺得攰。", jyutping: "ngo5 ___ zo2 zou2 hei2 san1, m4 gok3 dak1 gui6.", answer: "zaap6 gwaan3", answer_hanzi: 習慣, en: "I'm used to getting up early; I don't feel tired."}
    - {hanzi: "呢段路好___，要爬好多樓梯。", jyutping: "ni1 dyun6 lou6 hou2 ___, jiu3 paa4 hou2 do1 lau4 tai1.", answer: "ce3", answer_hanzi: 斜, en: "This stretch is steep; there are lots of steps to climb."}
