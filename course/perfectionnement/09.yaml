exercises:
  translate:
    - {hanzi: "佢第一日返工就俾老闆話。", jyutping: "keoi5 dai6 jat1 jat6 faan1 gung1 zau6 bei2 lou5 baan2 waa6.", en: "He got told off by the boss on his very first day at work."}
    - {hanzi: "學費，我哋暫時唔收。", jyutping: "hok6 fai3, ngo5 dei6 zaam6 si4 m4 sau1.", en: "Fees, we're not charging any for now."}
    - {hanzi: "佢離開香港嘅原因好簡單：租金太貴。", jyutping: "keoi5 lei4 hoi1 hoeng1 gong2 ge3 jyun4 jan1 hou2 gaan2 daan1: zou1 gam1 taai3 gwai3.", en: "The reason he left Hong Kong is simple: rents are too high."}
    - {hanzi: "我本來唔想去，結果玩得好開心。", jyutping: "ngo5 bun2 loi4 m4 soeng2 heoi3, git3 gwo2 waan2 dak1 hou2 hoi1 sam1.", en: "I didn't want to go at first, but in the end I had a great time."}
    - {hanzi: "佢好怕醜，成堂都冇出聲。", jyutping: "keoi5 hou2 paa3 cau2, seng4 tong4 dou1 mou5 ceot1 seng1.", en: "She's very shy; she didn't say a word the whole lesson."}
  fill:
    - {hanzi: "我枝筆___人攞咗。", jyutping: "ngo5 zi1 bat1 ___ jan4 lo2 zo2.", answer: "bei2", answer_hanzi: 俾, en: "Someone has taken my pen."}
    - {hanzi: "佢哋唔係想學法文，係___咗零食。", jyutping: "keoi5 dei6 m4 hai6 soeng2 hok6 faat3 man2, hai6 ___ zo2 ling4 sik6.", answer: "wai6", answer_hanzi: 為, en: "They don't want to learn French; they're here for the snacks."}
    - {hanzi: "你可唔可以借我枝筆？——___可以！", jyutping: "nei5 ho2 m4 ho2 ji5 ze3 ngo5 zi1 bat1? —— ___ ho2 ji5!", answer: "dong1 jin4", answer_hanzi: 當然, en: "Can you lend me a pen? — Of course!"}
    - {hanzi: "上次個老師俾佢哋___到喊。", jyutping: "soeng6 ci3 go3 lou5 si1 bei2 keoi5 dei6 ___ dou3 haam3.", answer: "gik1", answer_hanzi: 激, en: "Last time the teacher was driven to tears by them."}
    - {hanzi: "辭職呢件事，我___唔敢同阿媽講。", jyutping: "ci4 zik1 ni1 gin6 si6, ngo5 ___ m4 gam2 tung4 aa3 maa1 gong2.", answer: "zaam6 si4", answer_hanzi: 暫時, en: "Quitting my job, I don't dare tell Mum for now."}
