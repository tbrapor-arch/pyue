    - {hanzi: "份量好大，我一個人食唔晒。", jyutping: "fan6 loeng6 hou2 daai6, ngo5 jat1 go3 jan4 sik6 m4 saai3.", en: "The portion's huge; I can't finish it on my own."}
    - {hanzi: "風越嚟越大，頂帽差啲吹走。", jyutping: "fung1 jyut6 lai4 jyut6 daai6, deng2 mou2 caa1 di1 ceoi1 zau2.", en: "The wind's getting stronger; the hat nearly blew away."}
