  fill:
    - {hanzi: "週末人多到企都企唔___。", jyutping: "zau1 mut6 jan4 do1 dou3 kei5 dou1 kei5 m4 ___.", answer: "lok6", answer_hanzi: 落, en: "At weekends it's so crowded you can't even stand."}
    - {hanzi: "遊客太多，我煮都煮唔___。", jyutping: "jau4 haak3 taai3 do1, ngo5 zyu2 dou1 zyu2 m4 ___.", answer: "cit3", answer_hanzi: 切, en: "Too many tourists; I can't cook fast enough."}
    - {hanzi: "呢度係香港最大風嘅地方___。", jyutping: "ni1 dou6 hai6 hoeng1 gong2 zeoi3 daai6 fung1 ge3 dei6 fong1 ___.", answer: "zi1 jat1", answer_hanzi: 之一, en: "This is one of the windiest places in Hong Kong."}
    - {hanzi: "呢碗炒飯好食___我喺法國食過嘅。", jyutping: "ni1 wun2 caau2 faan6 hou2 sik6 ___ ngo5 hai2 faat3 gwok3 sik6 gwo3 ge3.", answer: "gwo3", answer_hanzi: 過, en: "This fried rice is better than what I've had in France."}
    - {hanzi: "由馬料水搭___要成個鐘頭。", jyutping: "jau4 maa5 liu6 seoi2 daap3 ___ jiu3 seng4 go3 zung1 tau4.", answer: "gaai1 dou6", answer_hanzi: 街渡, en: "The kaito from Ma Liu Shui takes a whole hour."}
