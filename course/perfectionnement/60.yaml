exercises:
  translate:
    - {hanzi: "多份報紙停刊，部分記者移民。", jyutping: "do1 fan6 bou3 zi2 ting4 hon2, bou6 fan6 gei3 ze2 ji4 man4.", en: "Several newspapers closed, and some journalists emigrated."}
    - {hanzi: "大部分人選擇沉默。", jyutping: "daai6 bou6 fan6 jan4 syun2 zaak6 cam4 mak6.", en: "Most people chose silence."}
    - {hanzi: "雖然穩定，但係屋企冇咗一半。", jyutping: "seoi1 jin4 wan2 ding6, daan6 hai6 uk1 kei2 mou5 zo2 jat1 bun3.", en: "Stable, yes, but half the family is gone."}
    - {hanzi: "社會撕裂咗，要慢慢修補。", jyutping: "se5 wui2 si1 lit6 zo2, jiu3 maan6 maan2 sau1 bou2.", en: "Society's been torn apart; it has to be mended slowly."}
    - {hanzi: "大家意見唔同，但係仍然可以包容。", jyutping: "daai6 gaa1 ji3 gin3 m4 tung4, daan6 hai6 jing4 jin4 ho2 ji5 baau1 jung4.", en: "People disagree, but they can still accept each other."}
  fill:
    - {hanzi: "___社會仍然有分歧，但是不少人繼續講廣東話。", jyutping: "___ se5 wui2 jing4 jin4 jau5 fan1 kei4, daan6 si6 bat1 siu2 jan4 gai3 zuk6 gong2 gwong2 dung1 waa2.", answer: "zeon2 gun2", answer_hanzi: 儘管, en: "Although society is still divided, many people continue to speak Cantonese."}
    - {hanzi: "移民潮令___下跌。", jyutping: "ji4 man4 ciu4 ling6 ___ haa6 dit3.", answer: "jan4 hau2", answer_hanzi: 人口, en: "The emigration wave has reduced the population."}
    - {hanzi: "佢哋五十年之後終於___。", jyutping: "keoi5 dei6 ng5 sap6 nin4 zi1 hau6 zung1 jyu1 ___.", answer: "wo4 gaai2", answer_hanzi: 和解, en: "After fifty years they finally made peace."}
    - {hanzi: "二零二一年，選舉___改變。", jyutping: "ji6 ling4 ji6 jat1 nin4, syun2 geoi2 ___ goi2 bin3.", answer: "zai3 dou6", answer_hanzi: 制度, en: "In 2021 the electoral system changed."}
    - {hanzi: "數十個工會及___相繼解散。", jyutping: "sou3 sap6 go3 gung1 wui2 kap6 ___ soeng1 gai3 gaai2 saan3.", answer: "zou2 zik1", answer_hanzi: 組織, en: "Dozens of unions and organisations disbanded one after another."}
