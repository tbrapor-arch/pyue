exercises:
  translate:
    - {hanzi: "呢份工，我做咗兩年之後就辭咗。", jyutping: "ni1 fan6 gung1, ngo5 zou6 zo2 loeng5 nin4 zi1 hau6 zau6 ci4 zo2.", en: "This job, I quit it after two years."}
    - {hanzi: "聽講業主出年又要加租。", jyutping: "teng1 gong2 jip6 zyu2 ceot1 nin2 jau6 jiu3 gaa1 zou1.", en: "I hear the landlord wants to raise the rent again next year."}
    - {hanzi: "佢講嘢咁細聲，連佢阿媽都聽唔到。", jyutping: "keoi5 gong2 je5 gam3 sai3 seng1, lin4 keoi5 aa3 maa1 dou1 teng1 m4 dou2.", en: "He speaks so quietly that even his mum can't hear him."}
    - {hanzi: "我仲以為你唔識講廣東話。", jyutping: "ngo5 zung6 ji5 wai4 nei5 m4 sik1 gong2 gwong2 dung1 waa2.", en: "And I thought you couldn't speak Cantonese."}
    - {hanzi: "間房細係細啲，不過好近地鐵站。", jyutping: "gaan1 fong2 sai3 hai6 sai3 di1, bat1 gwo3 hou2 kan5 dei6 tit3 zaam6.", en: "The room is a bit small, sure, but it's very close to the MTR station."}
  fill:
    - {hanzi: "你食咗飯未？食完___，我帶你去睇房。", jyutping: "nei5 sik6 zo2 faan6 mei6? sik6 jyun4 ___, ngo5 daai3 nei5 heoi3 tai2 fong2.", answer: "zi1 hau6", answer_hanzi: 之後, en: "Have you eaten? After eating, I'll take you to see the room."}
    - {hanzi: "我___你六點先嚟，點知你咁早到。", jyutping: "ngo5 ___ nei5 luk6 dim2 sin1 lai4, dim2 zi1 nei5 gam3 zou2 dou3.", answer: "ji5 wai4", answer_hanzi: 以為, en: "I thought you'd only come at six, but you're here so early."}
    - {hanzi: "你每個月要交___俾業主。", jyutping: "nei5 mui5 go3 jyut6 jiu3 gaau1 ___ bei2 jip6 zyu2.", answer: "zou1", answer_hanzi: 租, en: "You have to pay rent to the landlord every month."}
    - {hanzi: "___你係租我嘅，唔係租佢嘅。", jyutping: "___ nei5 hai6 zou1 ngo5 ge3, m4 hai6 zou1 keoi5 ge3.", answer: "zik1 hai6", answer_hanzi: 即係, en: "That means you're renting from me, not from him."}
    - {hanzi: "___我覺得好攰，想休息吓。", jyutping: "___ ngo5 gok3 dak1 hou2 gui6, soeng2 jau1 sik1 haa5.", answer: "zeoi3 gan6", answer_hanzi: 最近, en: "Lately I've been feeling tired; I want a rest."}
    - {hanzi: "我想轉吓___，唔想日日對住同一堵牆。", jyutping: "ngo5 soeng2 zyun3 haa5 ___, m4 soeng2 jat6 jat6 deoi3 zyu6 tung4 jat1 dou2 coeng4.", answer: "waan4 ging2", answer_hanzi: 環境, en: "I want a change of scene; I don't want to face the same wall every day."}
