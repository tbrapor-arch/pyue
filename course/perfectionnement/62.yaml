exercises:
  translate:
    - {hanzi: "佢間舖有一把舊式吊扇同一個好舊嘅掛鐘。", jyutping: "keoi5 gaan1 pou3 jau5 jat1 baa2 gau6 sik1 diu3 sin3 tung4 jat1 go3 hou2 gau6 ge3 gwaa3 zung1.", en: "His shop has an old-style ceiling fan and a very old wall clock."}
    - {hanzi: "首先，佢好舊；其次，佢好溫暖。", jyutping: "sau2 sin1, keoi5 hou2 gau6; kei4 ci3, keoi5 hou2 wan1 nyun5.", en: "First, it's old; second, it's warm."}
    - {hanzi: "放學之後我要去補習。", jyutping: "fong3 hok6 zi1 hau6 ngo5 jiu3 heoi3 bou2 zaap6.", en: "After school I have to go to tutoring."}
    - {hanzi: "我聽日有測驗，又有默書。", jyutping: "ngo5 ting1 jat6 jau5 caak1 jim6, jau6 jau5 mak6 syu1.", en: "Tomorrow I have a test and a dictation."}
    - {hanzi: "總括嚟講，佢係一個好好人。", jyutping: "zung2 kut3 lai4 gong2, keoi5 hai6 jat1 go3 hou2 hou2 jan4.", en: "To sum up, he's a really kind man."}
  fill:
    - {hanzi: "你個講稿___未？", jyutping: "nei5 go3 gong2 gou2 ___ mei6?", answer: "bui6 suk6", answer_hanzi: 背熟, en: "Have you learned your script by heart?"}
    - {hanzi: "上次口試我___，得咗六十分。", jyutping: "soeng6 ci3 hau2 si5 ngo5 ___, dak1 zo2 luk6 sap6 fan1.", answer: "hau2 zat6", answer_hanzi: 口窒, en: "Last oral exam I stumbled and got sixty."}
    - {hanzi: "牆上面有好多黑白___。", jyutping: "coeng4 soeng6 min6 jau5 hou2 do1 haak1 baak6 ___.", answer: "ziu3 pin2", answer_hanzi: 照片, en: "There are lots of black-and-white photos on the walls."}
    - {hanzi: "如果你攞___，我請你食菠蘿油。", jyutping: "jyu4 gwo2 nei5 lo2 ___, ngo5 ceng2 nei5 sik6 bo1 lo4 jau4.", answer: "mun5 fan1", answer_hanzi: 滿分, en: "If you get full marks, I'll treat you to pineapple buns."}
    - {hanzi: "講得好___，冇口窒。", jyutping: "gong2 dak1 hou2 ___, mou5 hau2 zat6.", answer: "lau4 lei6", answer_hanzi: 流利, en: "Very fluent, no stumbling."}
