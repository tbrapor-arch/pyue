exercises:
  translate:
    - {hanzi: "佢係好人，不過講嘢好粗口。", jyutping: "keoi5 hai6 hou2 jan4, bat1 gwo3 gong2 je5 hou2 cou1 hau2.", en: "He's a good man, but he swears a lot."}
    - {hanzi: "我買咗件新衫，係一件好靚嘅新衫。", jyutping: "ngo5 maai5 zo2 gin6 san1 saam1, hai6 jat1 gin6 hou2 leng3 ge3 san1 saam1.", en: "I bought a new top: a really nice new top."}
    - {hanzi: "學語言冇捷徑，最緊要係放膽開口。", jyutping: "hok6 jyu5 jin4 mou5 zit3 ging3, zeoi3 gan2 jiu3 hai6 fong3 daam2 hoi1 hau2.", en: "There's no shortcut to learning a language; the key is to be bold and speak."}
    - {hanzi: "佢嘅發音好準確，完全冇鬼佬腔。", jyutping: "keoi5 ge3 faat3 jam1 hou2 zeon2 kok3, jyun4 cyun4 mou5 gwai2 lou2 hong1.", en: "Her pronunciation is very accurate, with no foreign accent at all."}
    - {hanzi: "我唔使睇字幕都明。", jyutping: "ngo5 m4 sai2 tai2 zi6 mok6 dou1 ming4.", en: "I understand it without subtitles."}
  fill:
    - {hanzi: "我講錯嘢，佢會___我。", jyutping: "ngo5 gong2 co3 je5, keoi5 wui5 ___ ngo5.", answer: "gau2 zing3", answer_hanzi: 糾正, en: "When I say something wrong, she corrects me."}
    - {hanzi: "外國人肯講廣東話，真係好___。", jyutping: "ngoi6 gwok3 jan4 hang2 gong2 gwong2 dung1 waa2, zan1 hai6 hou2 ___.", answer: "naan4 dak1", answer_hanzi: 難得, en: "A foreigner willing to speak Cantonese is really something rare."}
    - {hanzi: "唔好怕___，開口講啦。", jyutping: "m4 hou2 paa3 ___, hoi1 hau2 gong2 laa1.", answer: "diu1 lim5", answer_hanzi: 丟臉, en: "Don't be afraid of losing face; speak up."}
    - {hanzi: "廣東話嘅形容詞擺喺名詞___。", jyutping: "gwong2 dung1 waa2 ge3 jing4 jung4 ci4 baai2 hai2 ming4 ci4 ___.", answer: "cin4 min6", answer_hanzi: 前面, en: "Cantonese adjectives go before the noun."}
    - {hanzi: "我睇港劇唔使睇___。", jyutping: "ngo5 tai2 gong2 kek6 m4 sai2 tai2 ___.", answer: "zi6 mok6", answer_hanzi: 字幕, en: "I watch Hong Kong dramas without subtitles."}
