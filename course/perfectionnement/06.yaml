exercises:
  translate:
    - {hanzi: "坐喺窗口嗰個女仔係我妹妹。", jyutping: "co5 hai2 coeng1 hau2 go2 go3 neoi5 zai2 hai6 ngo5 mui6 mui2.", en: "The girl sitting by the window is my younger sister."}
    - {hanzi: "我細個嗰陣時，成日喺舖頭溫書。", jyutping: "ngo5 sai3 go3 go2 zan6 si4, sing4 jat6 hai2 pou3 tau2 wan1 syu1.", en: "When I was little, I often did my studying in the shop."}
    - {hanzi: "後來佢儲夠錢，喺鄉下起咗間屋。", jyutping: "hau6 loi4 keoi5 cyu5 gau3 cin2, hai2 hoeng1 haa2 hei2 zo2 gaan1 uk1.", en: "Later he saved enough money and built a house in his home village."}
    - {hanzi: "打風都照樣開門，你老闆真係硬淨。", jyutping: "daa2 fung1 dou1 ziu3 joeng6 hoi1 mun4, nei5 lou5 baan2 zan1 hai6 ngaang6 zeng6.", en: "Opening as usual even in a typhoon: your boss really is tough."}
    - {hanzi: "呢個講法好舊，而家啲後生未必聽過。", jyutping: "ni1 go3 gong2 faat3 hou2 gau6, ji4 gaa1 di1 hau6 saang1 mei6 bit1 teng1 gwo3.", en: "This expression is very old; young people today may not have heard it."}
  fill:
    - {hanzi: "你而家坐緊___張櫈，係我老豆買嘅。", jyutping: "nei5 ji4 gaa1 co5 gan2 ___ zoeng1 dang3, hai6 ngo5 lou5 dau6 maai5 ge3.", answer: "go2", answer_hanzi: 嗰, en: "That stool you're sitting on now, my dad bought it."}
    - {hanzi: "___我哋住喺鄉下，而家住喺香港。", jyutping: "___ ngo5 dei6 zyu6 hai2 hoeng1 haa2, ji4 gaa1 zyu6 hai2 hoeng1 gong2.", answer: "go2 zan6 si4", answer_hanzi: 嗰陣時, en: "Back then we lived in the village; now we live in Hong Kong."}
    - {hanzi: "我哋喺鄉下住咗十年，___先搬出嚟香港。", jyutping: "ngo5 dei6 hai2 hoeng1 haa2 zyu6 zo2 sap6 nin4, ___ sin1 bun1 ceot1 lai4 hoeng1 gong2.", answer: "hau6 loi4", answer_hanzi: 後來, en: "We lived in the village for ten years; only later did we move out to Hong Kong."}
    - {hanzi: "佢考試合格？___啦，佢日日溫書。", jyutping: "keoi5 haau2 si5 hap6 gaak3? ___ laa1, keoi5 jat6 jat6 wan1 syu1.", answer: "gang2 hai6", answer_hanzi: 梗係, en: "Did she pass the exam? Of course, she studies every day."}
    - {hanzi: "啲人叫炸彈___「菠蘿」。", jyutping: "di1 jan4 giu3 zaa3 daan2 ___ \"bo1 lo4\".", answer: "zou6", answer_hanzi: 做, en: "People called the bombs 'pineapples'."}
    - {hanzi: "佢成世人___過好多苦。", jyutping: "keoi5 seng4 sai3 jan4 ___ gwo3 hou2 do1 fu2.", answer: "ging1 lik6", answer_hanzi: 經歷, en: "He went through a lot of hardship in his life."}
