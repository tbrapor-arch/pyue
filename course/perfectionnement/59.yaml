exercises:
  translate:
    - {hanzi: "如果淨係計錢嘅話，我蝕咗。", jyutping: "jyu4 gwo2 zing6 hai6 gai3 cin2 ge3 waa2, ngo5 sit6 zo2.", en: "If you only count money, I've lost out."}
    - {hanzi: "快啲走，唔係嘅話就趕唔切。", jyutping: "faai3 di1 zau2, m4 hai6 ge3 waa2 zau6 gon2 m4 cit3.", en: "Hurry up, otherwise we won't make it."}
    - {hanzi: "除非業主肯讓步，政府都幫唔到。", jyutping: "ceoi4 fei1 jip6 zyu2 hang2 joeng6 bou6, zing3 fu2 dou1 bong1 m4 dou2.", en: "Unless the landlord gives way, the government can't help."}
    - {hanzi: "佢加租搞到我成個月瞓唔着。", jyutping: "keoi5 gaa1 zou1 gaau2 dou3 ngo5 seng4 go3 jyut6 fan3 m4 zoek6.", en: "His rent rise left me unable to sleep for a month."}
    - {hanzi: "間間都係連鎖店，千篇一律。", jyutping: "gaan1 gaan1 dou1 hai6 lin4 so2 dim3, cin1 pin1 jat1 leot6.", en: "Every shop's a chain store; they're all the same."}
  fill:
    - {hanzi: "如果你退休___，梁記點算？", jyutping: "jyu4 gwo2 nei5 teoi3 jau1 ___, loeng4 gei3 dim2 syun3?", answer: "ge3 waa2", answer_hanzi: 嘅話, en: "If you retire, what happens to 梁記?"}
    - {hanzi: "嗰段片___我明白一間舖唔止係生意。", jyutping: "go2 dyun6 pin2 ___ ngo5 ming4 baak6 jat1 gaan1 pou3 m4 zi2 hai6 saang1 ji3.", answer: "ling6", answer_hanzi: 令, en: "That clip made me understand a shop isn't just a business."}
    - {hanzi: "聽朝去___吓附近啲老舖啦。", jyutping: "ting1 ziu1 heoi3 ___ haa5 fu6 gan6 di1 lou5 pou3 laa1.", answer: "bong1 can3", answer_hanzi: 幫襯, en: "Go and give the old shops nearby some business tomorrow morning."}
    - {hanzi: "政府有冇___老舖嘅計劃？", jyutping: "zing3 fu2 jau5 mou5 ___ lou5 pou3 ge3 gai3 waak6?", answer: "zi1 zo6", answer_hanzi: 資助, en: "Does the government have schemes to support old shops?"}
    - {hanzi: "淨係計___回報，我的確蝕咗。", jyutping: "zing6 hai6 gai3 ___ wui4 bou3, ngo5 dik1 kok3 sit6 zo2.", answer: "dyun2 kei4", answer_hanzi: 短期, en: "Counting only short-term returns, I've definitely lost out."}
