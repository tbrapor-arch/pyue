exercises:
  translate:
    - {hanzi: "我細個唔敢一個人搭船。", jyutping: "ngo5 sai3 go3 m4 gam2 jat1 go3 jan4 daap3 syun4.", en: "As a child I didn't dare take the ferry alone."}
    - {hanzi: "聽日使唔使返工？——唔使，放假。", jyutping: "ting1 jat6 sai2 m4 sai2 faan1 gung1? —— m4 sai2, fong3 gaa3.", en: "Do you have to work tomorrow? — No, it's a holiday."}
    - {hanzi: "佢喺台山出世，十五歲先落嚟香港。", jyutping: "keoi5 hai2 toi4 saan1 ceot1 sai3, sap6 ng5 seoi3 sin1 lok6 lai4 hoeng1 gong2.", en: "She was born in Taishan and only came down to Hong Kong at fifteen."}
    - {hanzi: "我住咗三年，已經適應咗香港嘅生活。", jyutping: "ngo5 zyu6 zo2 saam1 nin4, ji5 ging1 sik1 jing3 zo2 hoeng1 gong2 ge3 sang1 wut6.", en: "I've lived here three years and have got used to life in Hong Kong."}
    - {hanzi: "佢見工嗰日好緊張，打爛咗隻杯。", jyutping: "keoi5 gin3 gung1 go2 jat6 hou2 gan2 zoeng1, daa2 laan6 zo2 zek3 bui1.", en: "He was so nervous on the day of his interview that he broke a glass."}
  fill:
    - {hanzi: "你___唔___一個人行夜路？", jyutping: "nei5 ___ m4 ___ jat1 go3 jan4 haang4 je6 lou6?", answer: "gam2 / gam2", answer_hanzi: 敢 / 敢, en: "Do you dare walk home alone at night?"}
    - {hanzi: "你___驚，佢哋好好人。", jyutping: "nei5 ___ geng1, keoi5 dei6 hou2 hou2 jan4.", answer: "m4 sai2", answer_hanzi: 唔使, en: "Don't be afraid, they're very nice."}
    - {hanzi: "我已經移過一次___，唔想再移。", jyutping: "ngo5 ji5 ging1 ji4 gwo3 jat1 ci3 ___, m4 soeng2 zoi3 ji4.", answer: "man4", answer_hanzi: 民, en: "I've already emigrated once; I don't want to do it again."}
    - {hanzi: "我___，睇住間舖。", jyutping: "ngo5 ___, tai2 zyu6 gaan1 pou3.", answer: "lau4 dai1", answer_hanzi: 留低, en: "I'm staying, to look after the shop."}
    - {hanzi: "我好緊張___，唔係唔鍾意你。", jyutping: "ngo5 hou2 gan2 zoeng1 ___, m4 hai6 m4 zung1 ji3 nei5.", answer: "zaa3", answer_hanzi: 咋, en: "I'm just nervous, it's not that I don't like you."}
