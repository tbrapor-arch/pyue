exercises:
  translate:
    - {hanzi: "呢間舖貴過嗰間，不過質素好啲。", jyutping: "ni1 gaan1 pou3 gwai3 gwo3 go2 gaan1, bat1 gwo3 zat1 sou3 hou2 di1.", en: "This shop is dearer than that one, but the quality is better."}
    - {hanzi: "我冇我哥哥咁高。", jyutping: "ngo5 mou5 ngo5 go4 go1 gam3 gou1.", en: "I'm not as tall as my elder brother."}
    - {hanzi: "呢杯咖啡苦得滯，我飲唔落。", jyutping: "ni1 bui1 gaa3 fe1 fu2 dak1 zai6, ngo5 jam2 m4 lok6.", en: "This coffee is too bitter; I can't drink it."}
    - {hanzi: "香港嘅租金越嚟越貴。", jyutping: "hoeng1 gong2 ge3 zou1 gam1 jyut6 lai4 jyut6 gwai3.", en: "Rents in Hong Kong are getting more and more expensive."}
    - {hanzi: "比起機器，我寧願要有人情味嘅服務。", jyutping: "bei2 hei2 gei1 hei3, ngo5 ning4 jyun2 jiu3 jau5 jan4 cing4 mei6 ge3 fuk6 mou6.", en: "Compared with machines, I'd rather have service with a human touch."}
  fill:
    - {hanzi: "佢杯奶茶甜___梁記。", jyutping: "keoi5 bui1 naai5 caa4 tim4 ___ loeng4 gei3.", answer: "gwo3", answer_hanzi: 過, en: "Their milk tea is sweeter than Leung Kee's."}
    - {hanzi: "梁記冇佢哋___光猛。", jyutping: "loeng4 gei3 mou5 keoi5 dei6 ___ gwong1 maang5.", answer: "gam3", answer_hanzi: 咁, en: "Leung Kee isn't as bright as their place."}
    - {hanzi: "你要飲___兩杯先夠。", jyutping: "nei5 jiu3 jam2 ___ loeng5 bui1 sin1 gau3.", answer: "hei2 maa5", answer_hanzi: 起碼, en: "You need to drink at least two cups to be satisfied."}
    - {hanzi: "靚就靚，___貴得滯。", jyutping: "leng3 zau6 leng3, ___ gwai3 dak1 zai6.", answer: "daan6 hai6", answer_hanzi: 但係, en: "It's pretty, sure, but it's too expensive."}
    - {hanzi: "我___俾蓮姐鬧，都唔想飲機器整嘅奶茶。", jyutping: "ngo5 ___ bei2 lin4 ze2 naau6, dou1 m4 soeng2 jam2 gei1 hei3 zing2 ge3 naai5 caa4.", answer: "ning4 jyun2", answer_hanzi: 寧願, en: "I'd rather get told off by Lin-ze than drink machine-made milk tea."}
