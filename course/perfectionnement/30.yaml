exercises:
  translate:
    - {hanzi: "佢講起話上嚟，成個鐘都唔停。", jyutping: "keoi5 gong2 hei2 waa2 soeng5 lai4, seng4 go3 zung1 dou1 m4 ting4.", en: "Once she starts talking, she doesn't stop for an hour."}
    - {hanzi: "唔好停，繼續講落去。", jyutping: "m4 hou2 ting4, gai3 zuk6 gong2 lok6 heoi3.", en: "Don't stop, carry on talking."}
    - {hanzi: "祝你新年快樂，身體健康！", jyutping: "zuk1 nei5 san1 nin4 faai3 lok6, san1 tai2 gin6 hong1!", en: "Happy New Year, and good health to you!"}
    - {hanzi: "細路講完恭喜發財，就伸手攞利是。", jyutping: "sai3 lou6 gong2 jyun4 gung1 hei2 faat3 coi4, zau6 san1 sau2 lo2 lai6 si6.", en: "The kids say 'gung hei fat choi' and then hold out their hands for red packets."}
    - {hanzi: "樂仔今年成績好好，學業進步。", jyutping: "lok6 zai2 gam1 nin4 sing4 zik1 hou2 hou2, hok6 jip6 zeon3 bou6.", en: "Lok-zai's results are very good this year: real progress in his studies."}
  fill:
    - {hanzi: "阿爸寫___揮春___，成個人精神晒。", jyutping: "aa3 baa4 se2 ___ fai1 ceon1 ___, seng4 go3 jan4 zing1 san4 saai3.", answer: "hei2 / soeng5 lai4", answer_hanzi: 起 / 上嚟, en: "Once Dad gets going on the scrolls, he perks right up."}
    - {hanzi: "間舖開得___，我就寫___。", jyutping: "gaan1 pou3 hoi1 dak1 ___, ngo5 zau6 se2 ___.", answer: "lok6 heoi3 / lok6 heoi3", answer_hanzi: 落去 / 落去, en: "As long as the shop keeps going, I'll keep writing."}
    - {hanzi: "「福」字要___貼。", jyutping: "\"fuk1\" zi6 jiu3 ___ tip3.", answer: "dou3 zyun3", answer_hanzi: 倒轉, en: "The character 'fortune' goes upside down."}
    - {hanzi: "千祈唔好___佢老。", jyutping: "cin1 kei4 m4 hou2 ___ keoi5 lou5.", answer: "jim4", answer_hanzi: 嫌, en: "Whatever you do, don't suggest she's old."}
    - {hanzi: "唔知講咩，講「___」就最安全。", jyutping: "m4 zi1 gong2 me1, gong2 \"___\" zau6 zeoi3 on1 cyun4.", answer: "maan6 si6 jyu4 ji3", answer_hanzi: 萬事如意, en: "If you don't know what to say, 'may all go as you wish' is safest."}
