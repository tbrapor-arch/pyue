exercises:
  translate:
    - {hanzi: "你唔去呀？——係呀，我唔去。", jyutping: "nei5 m4 heoi3 aa4? —— hai6 aa3, ngo5 m4 heoi3.", en: "You're not going? — Right, I'm not going."}
    - {hanzi: "你唔鍾意食魚呀？——唔係，我好鍾意。", jyutping: "nei5 m4 zung1 ji3 sik6 jyu2 aa4? —— m4 hai6, ngo5 hou2 zung1 ji3.", en: "You don't like fish? — No, I love it."}
    - {hanzi: "台山話同廣東話嘅分別好大。", jyutping: "toi4 saan1 waa2 tung4 gwong2 dung1 waa2 ge3 fan1 bit6 hou2 daai6.", en: "The difference between Taishanese and Cantonese is big."}
    - {hanzi: "佢哋兩個講嘢，好似雞同鴨講。", jyutping: "keoi5 dei6 loeng5 go3 gong2 je5, hou2 ci5 gai1 tung4 aap3 gong2.", en: "When those two talk, it's like a chicken talking to a duck."}
    - {hanzi: "佢喺美國住咗廿年，同樣有好重嘅口音。", jyutping: "keoi5 hai2 mei5 gwok3 zyu6 zo2 jaa6 nin4, tung4 joeng6 jau5 hou2 cung5 ge3 hau2 jam1.", en: "He's lived in America for twenty years and still has a strong accent."}
  fill:
    - {hanzi: "你唔飲呀？——___，我唔飲。", jyutping: "nei5 m4 jam2 aa4? —— ___, ngo5 m4 jam2.", answer: "hai6", answer_hanzi: 係, en: "You're not drinking? — Right, I'm not."}
    - {hanzi: "你唔餓呀？——___，我好餓！", jyutping: "nei5 m4 ngo6 aa4? —— ___, ngo5 hou2 ngo6!", answer: "m4 hai6", answer_hanzi: 唔係, en: "You're not hungry? — Yes I am, I'm starving!"}
    - {hanzi: "呢兩隻字好___，我成日搞亂。", jyutping: "ni1 loeng5 zek3 zi6 hou2 ___, ngo5 sing4 jat6 gaau2 lyun6.", answer: "leoi6 ci5", answer_hanzi: 類似, en: "These two characters are very similar; I always mix them up."}
    - {hanzi: "舊時唐人街___都講台山話。", jyutping: "gau6 si4 tong4 jan4 gaai1 ___ dou1 gong2 toi4 saan1 waa2.", answer: "pou2 pin3", answer_hanzi: 普遍, en: "In the old days Chinatowns generally spoke Taishanese."}
    - {hanzi: "食飯唔使___。", jyutping: "sik6 faan6 m4 sai2 ___.", answer: "faan1 jik6", answer_hanzi: 翻譯, en: "Eating needs no translation."}
