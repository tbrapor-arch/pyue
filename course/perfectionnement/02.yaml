exercises:
  translate:
    - {hanzi: "凍奶茶走甜，唔該！", jyutping: "dung3 naai5 caa4 zau2 tim4, m4 goi1!", en: "Iced milk tea, no sugar, please!"}
    - {hanzi: "呢個套餐跟咖啡，唔使另外俾錢。", jyutping: "ni1 go3 tou3 caan1 gan1 gaa3 fe1, m4 sai2 ling6 ngoi6 bei2 cin2.", en: "This set comes with coffee; you don't pay for it separately."}
    - {hanzi: "佢淨係食咗一嚿菠蘿油，就話好飽。", jyutping: "keoi5 zing6 hai6 sik6 zo2 jat1 gau6 bo1 lo4 jau4, zau6 waa6 hou2 baau2.", en: "He only ate one pineapple butter bun and says he's full."}
    - {hanzi: "呢間舖只收現金，所有客都要去收銀俾錢。", jyutping: "ni1 gaan1 pou3 zi2 sau1 jin6 gam1, so2 jau5 haak3 dou1 jiu3 heoi3 sau1 ngan2 bei2 cin2.", en: "This shop takes cash only; every customer has to pay at the till."}
    - {hanzi: "鴛鴦嘅味道好特別，我第一次飲就頂唔順。", jyutping: "jyun1 joeng1 ge3 mei6 dou6 hou2 dak6 bit6, ngo5 dai6 jat1 ci3 jam2 zau6 ding2 m4 seon6.", en: "Yuenyeung has a very unusual taste; the first time I drank it, I couldn't stand it."}
  fill:
    - {hanzi: "蛋撻十點___，你遲過十一點嚟就冇喇。", jyutping: "daan6 taat1 sap6 dim2 ___, nei5 ci4 gwo3 sap6 jat1 dim2 lai4 zau6 mou5 laa3.", answer: "ceot1 lou4", answer_hanzi: 出爐, en: "The egg tarts come out at ten; if you come after eleven there are none left."}
    - {hanzi: "茶走就係用煉奶___糖。", jyutping: "caa4 zau2 zau6 hai6 jung6 lin6 naai5 ___ tong4.", answer: "doi6 tai3", answer_hanzi: 代替, en: "'茶走' means using condensed milk instead of sugar."}
    - {hanzi: "一個餐___蚊，好___食！", jyutping: "jat1 go3 caan1 ___ man1, hou2 ___ sik6!", answer: "sap6 gei2 / dai2", answer_hanzi: 十幾 / 抵, en: "A set meal for ten-odd dollars, what a bargain!"}
    - {hanzi: "食完西多士，我成個下晝都唔想___。", jyutping: "sik6 jyun4 sai1 do1 si2, ngo5 seng4 go3 haa6 zau3 dou1 m4 soeng2 ___.", answer: "juk1", answer_hanzi: 郁, en: "After the French toast, I didn't want to move all afternoon."}
    - {hanzi: "你想飲咩？——___啦，你揀。", jyutping: "nei5 soeng2 jam2 me1? —— ___ laa1, nei5 gaan2.", answer: "ceoi4 bin2", answer_hanzi: 隨便, en: "What do you want to drink? — Whatever, you choose."}
