exercises:
  translate:
    - {hanzi: "我住嗰間屋有一百年歷史。", jyutping: "ngo5 zyu6 go2 gaan1 uk1 jau5 jat1 baak3 nin4 lik6 si2.", en: "The house I'm staying in is a hundred years old."}
    - {hanzi: "佢介紹嗰個朋友識講法文。", jyutping: "keoi5 gaai3 siu6 go2 go3 pang4 jau5 sik1 gong2 faat3 man2.", en: "The friend she introduced speaks French."}
    - {hanzi: "佢哋一句廣東話，一句普通話，切換得好自然。", jyutping: "keoi5 dei6 jat1 geoi3 gwong2 dung1 waa2, jat1 geoi3 pou2 tung1 waa2, cit3 wun6 dak1 hou2 zi6 jin4.", en: "They switch between Cantonese and Mandarin from one sentence to the next, very naturally."}
    - {hanzi: "只要仲有人講，粵語就唔會死。", jyutping: "zi2 jiu3 zung6 jau5 jan4 gong2, jyut6 jyu5 zau6 m4 wui5 sei2.", en: "As long as people still speak it, Cantonese won't die."}
    - {hanzi: "啲歌詞要審批，批咗先可以唱。", jyutping: "di1 go1 ci4 jiu3 sam2 pai1, pai1 zo2 sin1 ho2 ji5 coeng3.", en: "The lyrics have to be approved; we can only sing them once they're approved."}
  fill:
    - {hanzi: "佢飲咗五十年___茶樓。", jyutping: "keoi5 jam2 zo2 ng5 sap6 nin4 ___ caa4 lau4.", answer: "ge3", answer_hanzi: 嘅, en: "The teahouse she's been going to for fifty years."}
