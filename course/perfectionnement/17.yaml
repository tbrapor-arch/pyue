exercises:
  translate:
    - {hanzi: "你可唔可以問吓佢幾點返嚟？", jyutping: "nei5 ho2 m4 ho2 ji5 man6 haa5 keoi5 gei2 dim2 faan1 lai4?", en: "Could you ask him what time he's coming back?"}
    - {hanzi: "阿媽叫我唔好同陌生人講嘢。", jyutping: "aa3 maa1 giu3 ngo5 m4 hou2 tung4 mak6 sang1 jan4 gong2 je5.", en: "Mum told me not to talk to strangers."}
    - {hanzi: "我唔知佢係邊個，不過佢好大隻。", jyutping: "ngo5 m4 zi1 keoi5 hai6 bin1 go3, bat1 gwo3 keoi5 hou2 daai6 zek3.", en: "I don't know who he is, but he's huge."}
    - {hanzi: "我爭少少就趕唔切尾班車。", jyutping: "ngo5 zaang1 siu2 siu2 zau6 gon2 m4 cit3 mei5 baan1 ce1.", en: "I very nearly missed the last bus."}
    - {hanzi: "佢一句都冇講，我先發覺自己誤會咗佢。", jyutping: "keoi5 jat1 geoi3 dou1 mou5 gong2, ngo5 sin1 faat3 gok3 zi6 gei2 ng6 wui6 zo2 keoi5.", en: "He didn't say a word, and only then did I realise I'd misjudged him."}
  fill:
    - {hanzi: "你今朝有冇___我部手機？", jyutping: "nei5 gam1 ziu1 jau5 mou5 ___ ngo5 bou6 sau2 gei1?", answer: "gin3 dou2", answer_hanzi: 見到, en: "Did you see my phone this morning?"}
    - {hanzi: "強哥___我唔好講。", jyutping: "koeng4 go1 ___ ngo5 m4 hou2 gong2.", answer: "giu3", answer_hanzi: 叫, en: "Keung-go told me not to tell."}
    - {hanzi: "好凍___，記得著多件衫。", jyutping: "hou2 dung3 ___, gei3 dak1 zoek3 do1 gin6 saam1.", answer: "bo3", answer_hanzi: 噃, en: "It's cold, mind; remember to put on another layer."}
    - {hanzi: "整吓嘢___，使乜多謝。", jyutping: "zing2 haa5 je5 ___, sai2 mat1 do1 ze6.", answer: "zi1 maa3", answer_hanzi: 之嘛, en: "I only fixed something; no need to thank me."}
    - {hanzi: "我___個錢箱唔見咗。", jyutping: "ngo5 ___ go3 cin4 soeng1 m4 gin3 zo2.", answer: "faat3 jin6", answer_hanzi: 發現, en: "I found that the cash box was gone."}
