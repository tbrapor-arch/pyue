exercises:
  translate:
    - {hanzi: "由中環搭船去長洲，一個鐘㗎咋。", jyutping: "jau4 zung1 waan4 daap3 syun4 heoi3 coeng4 zau1, jat1 go3 zung1 gaa3 zaa3.", en: "It's only an hour by ferry from Central to Cheung Chau."}
    - {hanzi: "呢個係乜嘢嚟？— 係葡撻嚟。", jyutping: "ni1 go3 hai6 mat1 je5 lai4? — hai6 pou4 taat1 lai4.", en: "What's this? — It's a Portuguese tart."}
    - {hanzi: "落雨就唔去咯。", jyutping: "lok6 jyu5 zau6 m4 heoi3 lo3.", en: "If it rains, we just won't go, then."}
    - {hanzi: "澳門一九九九年回歸，以前係葡萄牙嘅殖民地。", jyutping: "ou3 mun2 jat1 gau2 gau2 gau2 nin4 wui4 gwai1, ji5 cin4 hai6 pou4 tou4 ngaa4 ge3 zik6 man4 dei6.", en: "Macau returned in 1999; it used to be a Portuguese colony."}
    - {hanzi: "係咁嘅咩？我唔知噃。", jyutping: "hai6 gam2 ge3 me1? ngo5 m4 zi1 bo3.", en: "Is that so? I didn't know that."}
  fill:
    - {hanzi: "一個十幾蚊___，試吓啦！", jyutping: "jat1 go3 sap6 gei2 man1 ___, si3 haa5 laa1!", answer: "zi1 maa3", answer_hanzi: 之嘛, en: "Only ten-odd dollars each; give it a try!"}
    - {hanzi: "馬介休係鹹魚___。", jyutping: "maa5 gaai3 jau1 hai6 haam4 jyu2 ___.", answer: "lai4", answer_hanzi: 嚟, en: "Bacalhau is salt fish."}
    - {hanzi: "我哋入去___吓博物館。", jyutping: "ngo5 dei6 jap6 heoi3 ___ haa5 bok3 mat6 gun2.", answer: "caam1 gun1", answer_hanzi: 參觀, en: "Let's go in and look round the museum."}
    - {hanzi: "佢哋嘅菜係中西文化___出嚟嘅。", jyutping: "keoi5 dei6 ge3 coi3 hai6 zung1 sai1 man4 faa3 ___ ceot1 lai4 ge3.", answer: "jung4 hap6", answer_hanzi: 融合, en: "Their food came out of the blending of Chinese and Western cultures."}
    - {hanzi: "嗰段片已經___咗。", jyutping: "go2 dyun6 pin2 ji5 ging1 ___ zo2.", answer: "fung1 cyun4", answer_hanzi: 瘋傳, en: "That clip has already gone viral."}
