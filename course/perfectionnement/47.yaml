exercises:
  translate:
    - {hanzi: "佢一見到我就生蝦咁跳。", jyutping: "keoi5 jat1 gin3 dou2 ngo5 zau6 saang1 haa1 gam2 tiu3.", en: "The moment he saw me he went hopping mad."}
    - {hanzi: "你點會親自嚟？", jyutping: "nei5 dim2 wui5 can1 zi6 lai4?", en: "How come you came in person?"}
    - {hanzi: "唔通你唔記得我？", jyutping: "m4 tung1 nei5 m4 gei3 dak1 ngo5?", en: "Don't tell me you don't remember me?"}
    - {hanzi: "我仲記住佢著校服嘅樣子。", jyutping: "ngo5 zung6 gei3 zyu6 keoi5 zoek3 haau6 fuk6 ge3 joeng6 zi2.", en: "I still remember how she looked in her school uniform."}
    - {hanzi: "佢忽然間沉默咗。", jyutping: "keoi5 fat1 jin4 gaan1 cam4 mak6 zo2.", en: "He suddenly fell silent."}
  fill:
    - {hanzi: "___扮！我知你係邊個。", jyutping: "___ baan6! ngo5 zi1 nei5 hai6 bin1 go3.", answer: "sai2 mat1", answer_hanzi: 使乜, en: "Stop pretending! I know who you are."}
    - {hanzi: "我前年先___，未睇清楚啲租客。", jyutping: "ngo5 cin4 nin2 sin1 ___, mei6 tai2 cing1 co2 di1 zou1 haak3.", answer: "zip3 sau2", answer_hanzi: 接手, en: "I only took over the year before last; I hadn't looked properly at the tenants."}
    - {hanzi: "你加租係咪為咗___？", jyutping: "nei5 gaa1 zou1 hai6 mai6 wai6 zo2 ___?", answer: "bou3 sau4", answer_hanzi: 報仇, en: "Did you raise the rent to get revenge?"}
    - {hanzi: "佢仲有___嚟？", jyutping: "keoi5 zung6 jau5 ___ lai4?", answer: "min2", answer_hanzi: 面, en: "He's got the nerve to come?"}
    - {hanzi: "佢___咗我五十年。", jyutping: "keoi5 ___ zo2 ngo5 ng5 sap6 nin4.", answer: "nau1", answer_hanzi: 嬲, en: "He's been angry with me for fifty years."}
