exercises:
  translate:
    - {hanzi: "佢話佢今晚唔得閒喎。", jyutping: "keoi5 waa6 keoi5 gam1 maan5 m4 dak1 haan4 wo3.", en: "She says she's busy tonight."}
    - {hanzi: "我阿媽問你生意好唔好。", jyutping: "ngo5 aa3 maa1 man6 nei5 saang1 ji3 hou2 m4 hou2.", en: "My mum asks whether business is good."}
    - {hanzi: "佢叫我唔好話俾你知。", jyutping: "keoi5 giu3 ngo5 m4 hou2 waa6 bei2 nei5 zi1.", en: "He told me not to tell you."}
    - {hanzi: "大鑊，我瞞咗佢成年！", jyutping: "daai6 wok6, ngo5 mun4 zo2 keoi5 seng4 nin4!", en: "Disaster, I've been hiding it from her for a whole year!"}
    - {hanzi: "佢帶咗成箱紅酒嚟做禮物，好誇張。", jyutping: "keoi5 daai3 zo2 seng4 soeng1 hung4 zau2 lai4 zou6 lai5 mat6, hou2 kwaa1 zoeng1.", en: "She brought a whole case of red wine as a present: so over the top."}
  fill:
    - {hanzi: "我阿媽話你間舖好得意___。", jyutping: "ngo5 aa3 maa1 waa6 nei5 gaan1 pou3 hou2 dak1 ji3 ___.", answer: "wo3", answer_hanzi: 喎, en: "My mum says your shop is charming."}
    - {hanzi: "佢___我點解唔同佢講。", jyutping: "keoi5 ___ ngo5 dim2 gaai2 m4 tung4 keoi5 gong2.", answer: "man6", answer_hanzi: 問, en: "She asks me why I didn't tell her."}
    - {hanzi: "梁伯攞咗兩杯奶茶出嚟___。", jyutping: "loeng4 baak3 lo2 zo2 loeng5 bui1 naai5 caa4 ceot1 lai4 ___.", answer: "daa2 jyun4 coeng4", answer_hanzi: 打圓場, en: "梁伯 brought out two milk teas to smooth things over."}
    - {hanzi: "個個都好___佢。", jyutping: "go3 go3 dou1 hou2 ___ keoi5.", answer: "sek3", answer_hanzi: 錫, en: "Everyone adores him."}
    - {hanzi: "佢飲咗一___奶茶，個面鬆咗啲。", jyutping: "keoi5 jam2 zo2 jat1 ___ naai5 caa4, go3 min6 sung1 zo2 di1.", answer: "daam6", answer_hanzi: 啖, en: "She took a sip of milk tea, and her face softened."}
