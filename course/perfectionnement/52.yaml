exercises:
  translate:
    - {hanzi: "雖然佢冇錢，但係個個都鍾意佢。", jyutping: "seoi1 jin4 keoi5 mou5 cin2, daan6 hai6 go3 go3 dou1 zung1 ji3 keoi5.", en: "Although he had no money, everyone liked him."}
    - {hanzi: "就算減租，都補償唔到我哋嘅辛苦。", jyutping: "zau6 syun3 gaam2 zou1, dou1 bou2 soeng4 m4 dou2 ngo5 dei6 ge3 san1 fu2.", en: "Even cutting the rent can't make up for our hardship."}
    - {hanzi: "佢從來冇怪過你。", jyutping: "keoi5 cung4 loi4 mou5 gwaai3 gwo3 nei5.", en: "She never blamed you."}
    - {hanzi: "我好慚愧，收埋咗呢張相咁耐。", jyutping: "ngo5 hou2 caam4 kwai5, sau1 maai4 zo2 ni1 zoeng1 soeng2 gam3 noi6.", en: "I'm deeply ashamed to have hidden this photo for so long."}
    - {hanzi: "你考慮清楚先答覆我。", jyutping: "nei5 haau2 leoi6 cing1 co2 sin1 daap3 fuk1 ngo5.", en: "Think it over before you reply."}
  fill:
    - {hanzi: "___我唔係有心，責任都喺我。", jyutping: "___ ngo5 m4 hai6 jau5 sam1, zaak3 jam6 dou1 hai2 ngo5.", answer: "zeon2 gun2", answer_hanzi: 儘管, en: "Although I didn't mean it, the responsibility is mine."}
    - {hanzi: "十年內___租金。", jyutping: "sap6 nin4 noi6 ___ zou1 gam1.", answer: "dung3 git3", answer_hanzi: 凍結, en: "The rent is frozen for ten years."}
    - {hanzi: "佢屋企人話唔___，逼佢分手。", jyutping: "keoi5 uk1 kei2 jan4 waa6 m4 ___, bik1 keoi5 fan1 sau2.", answer: "mun4 dong1 wu6 deoi3", answer_hanzi: 門當戶對, en: "Her family said they weren't of equal standing and forced her to break up."}
    - {hanzi: "我嗰陣好___你。", jyutping: "ngo5 go2 zan6 hou2 ___ nei5.", answer: "sin6 mou6", answer_hanzi: 羨慕, en: "Back then I really envied you."}
    - {hanzi: "我知你有自尊，可能會___。", jyutping: "ngo5 zi1 nei5 jau5 zi6 zyun1, ho2 nang4 wui5 ___.", answer: "keoi5 zyut6", answer_hanzi: 拒絕, en: "I know you're proud and may refuse."}
