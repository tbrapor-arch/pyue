exercises:
  translate:
    - {hanzi: "條片令到好多人認識我哋。", jyutping: "tiu4 pin2 ling6 dou3 hou2 do1 jan4 jing6 sik1 ngo5 dei6.", en: "The clip made lots of people get to know us."}
    - {hanzi: "我哋今晚 jam 歌，你嚟唔嚟？", jyutping: "ngo5 dei6 gam1 maan5 jam go1, nei5 lai4 m4 lai4?", en: "We're rehearsing tonight; are you coming?"}
    - {hanzi: "疫情嗰幾年，所有演出都停咗。", jyutping: "jik6 cing4 go2 gei2 nin4, so2 jau5 jin2 ceot1 dou1 ting4 zo2.", en: "During the pandemic years, all shows stopped."}
    - {hanzi: "佢哋寧願收入少啲，都要寫原創歌。", jyutping: "keoi5 dei6 ning4 jyun6 sau1 jap6 siu2 di1, dou1 jiu3 se2 jyun4 cong3 go1.", en: "They'd rather earn less and still write original songs."}
    - {hanzi: "我哋四個好有默契。", jyutping: "ngo5 dei6 sei3 go3 hou2 jau5 mak6 kai3.", en: "The four of us have great chemistry."}
  fill:
    - {hanzi: "首歌太___，老闆叫我哋唔好唱。", jyutping: "sau2 go1 taai3 ___, lou5 baan2 giu3 ngo5 dei6 m4 hou2 coeng3.", answer: "man5 gam2", answer_hanzi: 敏感, en: "The song is too sensitive; the owner told us not to sing it."}
    - {hanzi: "佢哋___我哋知道廣東話本身就夠型。", jyutping: "keoi5 dei6 ___ ngo5 dei6 zi1 dou3 gwong2 dung1 waa2 bun2 san1 zau6 gau3 jing4.", answer: "ling6 dou3", answer_hanzi: 令到, en: "They made us realise Cantonese itself is cool enough."}
    - {hanzi: "好多 live house 因為加租同___問題執笠。", jyutping: "hou2 do1 live house jan1 wai6 gaa1 zou1 tung4 ___ man6 tai4 zap1 lap1.", answer: "paai4 ziu3", answer_hanzi: 牌照, en: "Many live houses closed over rent rises and licence problems."}
    - {hanzi: "我哋自己喺網上___，唔使唱片公司。", jyutping: "ngo5 dei6 zi6 gei2 hai2 mong5 soeng6 ___, m4 sai2 coeng3 pin2 gung1 si1.", answer: "syun1 cyun4", answer_hanzi: 宣傳, en: "We promote ourselves online; we don't need a record label."}
    - {hanzi: "下個月有場 gig，大家嚟___啦！", jyutping: "haa6 go3 jyut6 jau5 coeng4 gig, daai6 gaa1 lai4 ___ laa1!", answer: "caang3 coeng4", answer_hanzi: 撐場, en: "There's a gig next month; come and support us, everyone!"}
