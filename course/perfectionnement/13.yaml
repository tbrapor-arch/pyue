exercises:
  translate:
    - {hanzi: "根據新租約，租金由出年一月開始增加。", jyutping: "gan1 geoi3 san1 zou1 joek3, zou1 gam1 jau4 ceot1 nin2 jat1 jyut6 hoi1 ci2 zang1 gaa1.", en: "Under the new lease, the rent goes up from January next year."}
    - {hanzi: "由於天氣唔好，今日唔開門。", jyutping: "jau4 jyu1 tin1 hei3 m4 hou2, gam1 jat6 m4 hoi1 mun4.", en: "Owing to bad weather, we're closed today."}
    - {hanzi: "佢喺信度提出咗兩個條件。", jyutping: "keoi5 hai2 seon3 dou6 tai4 ceot1 zo2 loeng5 go3 tiu4 gin2.", en: "He set out two conditions in the letter."}
    - {hanzi: "請於月底之前回覆。", jyutping: "cing2 jyu1 jyut6 dai2 zi1 cin4 wui4 fuk1.", en: "Please reply before the end of the month."}
    - {hanzi: "呢份通知好狠，一個月之內就要搬走。", jyutping: "ni1 fan6 tung1 zi1 hou2 han2, jat1 go3 jyut6 zi1 noi6 zau6 jiu3 bun1 zau2.", en: "This notice is harsh: we have to move out within a month."}
  fill:
    - {hanzi: "「閣下」即係「___」，好客氣嘅講法。", jyutping: "\"gok3 haa6\" zik1 hai6 \"___\", hou2 haak3 hei3 ge3 gong2 faat3.", answer: "nei5", answer_hanzi: 你, en: "'閣下' means 'you'; it's a very polite way of saying it."}
    - {hanzi: "寫信用「是」，講嘢就用「___」。", jyutping: "se2 seon3 jung6 \"si6\", gong2 je5 zau6 jung6 \"___\".", answer: "hai6", answer_hanzi: 係, en: "In writing you use 是; when speaking, 係."}
    - {hanzi: "租約年底___，要唔要續租？", jyutping: "zou1 joek3 nin4 dai2 ___, jiu3 m4 jiu3 zuk6 zou1?", answer: "dou3 kei4", answer_hanzi: 到期, en: "The lease runs out at the end of the year; do we renew?"}
    - {hanzi: "差餉___維修費用又加咗。", jyutping: "caai1 hoeng2 ___ wai4 sau1 fai3 jung6 jau6 gaa1 zo2.", answer: "tung4", answer_hanzi: 同, en: "Rates and maintenance costs have gone up too."}
    - {hanzi: "冇時間喇，我哋要快啲諗___。", jyutping: "mou5 si4 gaan3 laa3, ngo5 dei6 jiu3 faai3 di1 nam2 ___.", answer: "gai2", answer_hanzi: 計, en: "There's no time; we need to come up with a plan quickly."}
