exercises:
  translate:
    - {hanzi: "根據封信，我哋仲有一個月時間。", jyutping: "gan1 geoi3 fung1 seon3, ngo5 dei6 zung6 jau5 jat1 go3 jyut6 si4 gaan3.", en: "According to the letter, we still have a month."}
    - {hanzi: "佢俾啲學生玩到唔知點算。", jyutping: "keoi5 bei2 di1 hok6 saang1 waan2 dou3 m4 zi1 dim2 syun3.", en: "The students teased him so much he didn't know what to do."}
    - {hanzi: "阿婆隻狗竟然多過我啲朋友。", jyutping: "aa3 po4 zek3 gau2 ging2 jin4 do1 gwo3 ngo5 di1 pang4 jau5.", en: "The old lady's dog actually has more friends than me."}
    - {hanzi: "佢瞓唔着，半夜成日落嚟飲奶茶。", jyutping: "keoi5 fan3 m4 zoek6, bun3 je2 sing4 jat6 lok6 lai4 jam2 naai5 caa4.", en: "He can't sleep, so he keeps coming down at midnight for milk tea."}
    - {hanzi: "我哋冚唪唥都覺得佢個計好。", jyutping: "ngo5 dei6 ham6 baang6 laang6 dou1 gok3 dak1 keoi5 go3 gai2 hou2.", en: "All of us think his plan is good."}
  fill:
    - {hanzi: "我第一堂___班中學生玩到死。", jyutping: "ngo5 dai6 jat1 tong4 ___ baan1 zung1 hok6 saang1 waan2 dou3 sei2.", answer: "bei2", answer_hanzi: 俾, en: "In my first lesson I got teased to death by a bunch of teenagers."}
    - {hanzi: "佢___第一個到，從來冇遲過。", jyutping: "keoi5 ___ dai6 jat1 go3 dou3, cung4 loi4 mou5 ci4 gwo3.", answer: "mui5 tong4 dou1", answer_hanzi: 每堂都, en: "She's the first to arrive at every lesson; she's never been late."}
    - {hanzi: "___Instagram，你寫嗰段嘢有幾多個like？", jyutping: "___ Instagram, nei5 se2 go2 dyun6 je5 jau5 gei2 do1 go3 like?", answer: "gong2 hei2", answer_hanzi: 講起, en: "Speaking of Instagram, how many likes did your post get?"}
    - {hanzi: "阿伯講「唔准」，___係「諗吓先」。", jyutping: "aa3 baak3 gong2 \"m4 zeon2\", ___ hai6 \"nam2 haa5 sin1\".", answer: "zik1", answer_hanzi: 即, en: "When the old man says 'not allowed', it means 'let me think'."}
    - {hanzi: "四成租，業主真係好___。", jyutping: "sei3 sing4 zou1, jip6 zyu2 zan1 hai6 hou2 ___.", answer: "han2", answer_hanzi: 狠, en: "Forty per cent more rent: the landlord really is ruthless."}
