exercises:
  translate:
    - {hanzi: "我飲開凍奶茶，今日想試吓鴛鴦。", jyutping: "ngo5 jam2 hoi1 dung3 naai5 caa4, gam1 jat6 soeng2 si3 haa5 jyun1 joeng1.", en: "I usually drink iced milk tea; today I'd like to try a yuenyeung."}
    - {hanzi: "佢哋玩起上嚟，成晚都唔肯走。", jyutping: "keoi5 dei6 waan2 hei2 soeng5 lai4, seng4 maan5 dou1 m4 hang2 zau2.", en: "Once they start having fun, they won't leave all night."}
    - {hanzi: "阿婆多數朝早嚟，間唔中晏晝都會嚟。", jyutping: "aa3 po4 do1 sou3 ziu1 zou2 lai4, gaan3 m4 zung1 aan3 zau3 dou1 wui5 lai4.", en: "The old lady usually comes in the morning, and now and then at lunchtime too."}
    - {hanzi: "我細佬養咗兩隻貓，唔准人摸。", jyutping: "ngo5 sai3 lou2 joeng5 zo2 loeng5 zek3 maau1, m4 zeon2 jan4 mo2.", en: "My little brother keeps two cats and won't let anyone touch them."}
    - {hanzi: "佢記性好差，有陣時連自己幾歲都唔記得。", jyutping: "keoi5 gei3 sing3 hou2 caa1, jau5 zan6 si4 lin4 zi6 gei2 gei2 seoi3 dou1 m4 gei3 dak1.", en: "Her memory is terrible; sometimes she even forgets how old she is."}
  fill:
    - {hanzi: "陳生坐___門口第一張枱。", jyutping: "can4 saang1 co5 ___ mun4 hau2 dai6 jat1 zoeng1 toi2.", answer: "hoi1", answer_hanzi: 開, en: "Mr Chan always sits at the first table by the door."}
    - {hanzi: "佢哋講___嘢___，大聲到隔籬枱都聽到。", jyutping: "keoi5 dei6 gong2 ___ je5 ___, daai6 seng1 dou3 gaak3 lei4 toi2 dou1 teng1 dou2.", answer: "hei2 / soeng5 lai4", answer_hanzi: 起 / 上嚟, en: "Once they start talking, they're so loud the next table can hear."}
    - {hanzi: "食完飯，佢就同我講句「聽日見」，___返工。", jyutping: "sik6 jyun4 faan6, keoi5 zau6 tung4 ngo5 gong2 geoi3 \"ting1 jat6 gin3\", ___ faan1 gung1.", answer: "jin4 hau6", answer_hanzi: 然後, en: "After eating, he says 'see you tomorrow' to me and then goes to work."}
    - {hanzi: "邊個坐咗佢個位，佢就會___。", jyutping: "bin1 go3 co5 zo2 keoi5 go3 wai2, keoi5 zau6 wui5 ___.", answer: "hak1 min6", answer_hanzi: 黑面, en: "If anyone takes his seat, he sulks."}
    - {hanzi: "舖頭___帶寵物入嚟。", jyutping: "pou3 tau2 ___ daai3 cung2 mat6 jap6 lai4.", answer: "m4 zeon2", answer_hanzi: 唔准, en: "Pets are not allowed in the shop."}
