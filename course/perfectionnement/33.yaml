exercises:
  translate:
    - {hanzi: "你可唔可以攞杯水嚟俾我？", jyutping: "nei5 ho2 m4 ho2 ji5 lo2 bui1 seoi2 lai4 bei2 ngo5?", en: "Could you bring me a glass of water?"}
    - {hanzi: "我聽日帶阿爸去睇醫生。", jyutping: "ngo5 ting1 jat6 daai3 aa3 baa4 heoi3 tai2 ji1 sang1.", en: "Tomorrow I'm taking Dad to see the doctor."}
    - {hanzi: "好彩你及時叫救護車。", jyutping: "hou2 coi2 nei5 kap6 si4 giu3 gau3 wu6 ce1.", en: "Luckily you called an ambulance in time."}
    - {hanzi: "佢好硬頸，成日唔聽話。", jyutping: "keoi5 hou2 ngaang6 geng2, sing4 jat6 m4 teng1 waa6.", en: "He's very stubborn; he never does what he's told."}
    - {hanzi: "留得青山在，唔怕冇柴燒，你唔好再搏命喇。", jyutping: "lau4 dak1 cing1 saan1 zoi6, m4 paa3 mou5 caai4 siu1, nei5 m4 hou2 zoi3 bok3 meng6 laa3.", en: "Health comes first; stop working yourself to death."}
  fill:
    - {hanzi: "阿爸啲藥喺舖頭，你___嚟俾我。", jyutping: "aa3 baa4 di1 joek6 hai2 pou3 tau2, nei5 ___ lai4 bei2 ngo5.", answer: "lo2", answer_hanzi: 攞, en: "Dad's medicine is at the shop; bring it to me."}
    - {hanzi: "病人血管___咗，要做手術。", jyutping: "beng6 jan4 hyut3 gun2 ___ zo2, jiu3 zou6 sau2 seot6.", answer: "sak1", answer_hanzi: 塞, en: "The patient's artery is blocked; he needs an operation."}
    - {hanzi: "做完手術要留院___幾日。", jyutping: "zou6 jyun4 sau2 seot6 jiu3 lau4 jyun2 ___ gei2 jat6.", answer: "gun1 caat3", answer_hanzi: 觀察, en: "After the operation he has to stay in hospital for a few days' observation."}
    - {hanzi: "傷口要保持乾淨，唔好___。", jyutping: "soeng1 hau2 jiu3 bou2 ci4 gon1 zeng6, m4 hou2 ___.", answer: "faat3 jim4", answer_hanzi: 發炎, en: "Keep the wound clean so it doesn't get infected."}
    - {hanzi: "我驚到成晚___。", jyutping: "ngo5 geng1 dou3 seng4 maan5 ___.", answer: "fan3 m4 zoek6", answer_hanzi: 瞓唔着, en: "I was so scared I couldn't sleep all night."}
