exercises:
  translate:
    - {hanzi: "估計全球有八千幾萬人講粵語。", jyutping: "gu2 gai3 cyun4 kau4 jau5 baat3 cin1 gei2 maan6 jan4 gong2 jyut6 jyu5.", en: "An estimated eighty-odd million people speak Cantonese worldwide."}
    - {hanzi: "第一批去金山嘅華工，大部分由台山嚟。", jyutping: "dai6 jat1 pai1 heoi3 gam1 saan1 ge3 waa4 gung1, daai6 bou6 fan6 jau4 toi4 saan1 lai4.", en: "Most of the first Chinese labourers who went to Gold Mountain came from Taishan."}
    - {hanzi: "喺海外出世嘅細路，好多都唔識講。", jyutping: "hai2 hoi2 ngoi6 ceot1 sai3 ge3 sai3 lou6, hou2 do1 dou1 m4 sik1 gong2.", en: "Many children born overseas can't speak it."}
    - {hanzi: "粵語慢慢俾普通話取代。", jyutping: "jyut6 jyu5 maan6 maan2 bei2 pou2 tung1 waa2 ceoi2 doi6.", en: "Cantonese is slowly being replaced by Mandarin."}
    - {hanzi: "語言要一代傳承一代。", jyutping: "jyu5 jin4 jiu3 jat1 doi6 cyun4 sing4 jat1 doi6.", en: "A language has to be passed on from one generation to the next."}
  fill:
    - {hanzi: "粵語係一個___全球嘅語言。", jyutping: "jyut6 jyu5 hai6 jat1 go3 ___ cyun4 kau4 ge3 jyu5 jin4.", answer: "pin3 bou3", answer_hanzi: 遍佈, en: "Cantonese is a language spread all over the world."}
    - {hanzi: "美國加州發現金礦___，好多華工去咗。", jyutping: "mei5 gwok3 gaa1 zau1 faat3 jin6 gam1 kwong3 ___, hou2 do1 waa4 gung1 heoi3 zo2.", answer: "ge3 si4 hau6", answer_hanzi: 嘅時候, en: "When gold was found in California, many Chinese labourers went."}
    - {hanzi: "最大嘅問題係___。", jyutping: "zeoi3 daai6 ge3 man6 tai4 hai6 ___.", answer: "cyun4 sing4", answer_hanzi: 傳承, en: "The biggest problem is passing it on."}
    - {hanzi: "有啲地方保留咗一百年前嘅___。", jyutping: "jau5 di1 dei6 fong1 bou2 lau4 zo2 jat1 baak3 nin4 cin4 ge3 ___.", answer: "ci4 wui6", answer_hanzi: 詞彙, en: "Some places have kept vocabulary from a hundred years ago."}
    - {hanzi: "佢哋去咗溫哥華、多倫多同___。", jyutping: "keoi5 dei6 heoi3 zo2 wan1 go1 waa4, do1 leon4 do1 tung4 ___.", answer: "sik1 nei4", answer_hanzi: 悉尼, en: "They went to Vancouver, Toronto and Sydney."}
