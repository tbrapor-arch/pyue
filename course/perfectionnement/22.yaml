exercises:
  translate:
    - {hanzi: "我沖咗個涼先，然後同你傾計。", jyutping: "ngo5 cung1 zo2 go3 loeng4 sin1, jin4 hau6 tung4 nei5 king1 gai2.", en: "Let me have a shower first, then I'll chat with you."}
    - {hanzi: "我哋周末搭船去長洲食海鮮。", jyutping: "ngo5 dei6 zau1 mut6 daap3 syun4 heoi3 coeng4 zau1 sik6 hoi2 sin1.", en: "At the weekend we're taking the ferry to Cheung Chau to eat seafood."}
    - {hanzi: "我喺山上面蕩失路，好彩有個導遊帶我落山。", jyutping: "ngo5 hai2 saan1 soeng6 min6 dong6 sat1 lou6, hou2 coi2 jau5 go3 dou6 jau4 daai3 ngo5 lok6 saan1.", en: "I got lost on the hill; luckily a guide led me down."}
    - {hanzi: "佢哋傾咗成晚計，都唔覺得攰。", jyutping: "keoi5 dei6 king1 zo2 seng4 maan5 gai2, dou1 m4 gok3 dak1 gui6.", en: "They chatted all night and didn't feel tired at all."}
    - {hanzi: "考試之前我好緊張，成晚瞓唔着。", jyutping: "haau2 si5 zi1 cin4 ngo5 hou2 gan2 zoeng1, seng4 maan5 fan3 m4 zoek6.", en: "Before the exam I was so nervous I couldn't sleep all night."}
  fill:
    - {hanzi: "我返到屋企，沖咗___涼。", jyutping: "ngo5 faan1 dou3 uk1 kei2, cung1 zo2 ___ loeng4.", answer: "go3", answer_hanzi: 個, en: "When I got home, I had a shower."}
    - {hanzi: "佢哋一路行一路___。", jyutping: "keoi5 dei6 jat1 lou6 haang4 jat1 lou6 ___.", answer: "king1 gai2", answer_hanzi: 傾計, en: "They chatted as they walked."}
