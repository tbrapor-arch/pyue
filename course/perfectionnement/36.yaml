exercises:
  translate:
    - {hanzi: "啲菠蘿包賣晒咁滯。", jyutping: "di1 bo1 lo4 baau1 maai6 saai3 gam3 zai6.", en: "The pineapple buns are almost sold out."}
    - {hanzi: "可唔可以平啲啲？", jyutping: "ho2 m4 ho2 ji5 peng4 di1 di1?", en: "Could you make it a tiny bit cheaper?"}
    - {hanzi: "佢哋個個月都準時找數。", jyutping: "keoi5 dei6 go3 go3 jyut6 dou1 zeon2 si4 zaau2 sou3.", en: "They pay on time every single month."}
    - {hanzi: "通脹咁高，成本年年都漲。", jyutping: "tung1 zoeng3 gam3 gou1, sing4 bun2 nin4 nin4 dou1 zoeng3.", en: "With inflation this high, costs go up every year."}
    - {hanzi: "我唔想蝕底，你最多加半成。", jyutping: "ngo5 m4 soeng2 sit6 dai2, nei5 zeoi3 do1 gaa1 bun3 sing4.", en: "I don't want to lose out; raise it five per cent at most."}
  fill:
    - {hanzi: "我攰到瞓得___。", jyutping: "ngo5 gui6 dou3 fan3 dak1 ___.", answer: "gam3 zai6", answer_hanzi: 咁滯, en: "I'm so tired I'm almost asleep."}
    - {hanzi: "做批發，每箱都係賺___。", jyutping: "zou6 pai1 faat3, mui5 soeng1 dou1 hai6 zaan6 ___.", answer: "di1 di1", answer_hanzi: 啲啲, en: "In wholesale you make a tiny bit on each crate."}
    - {hanzi: "價錢唔變，份量少咗，___加咗價。", jyutping: "gaa3 cin4 m4 bin3, fan6 loeng6 siu2 zo2, ___ gaa1 zo2 gaa3.", answer: "dang2 jyu1", answer_hanzi: 等於, en: "Same price, smaller quantity: that's the same as a price rise."}
    - {hanzi: "佢___等我講完先出聲。", jyutping: "keoi5 ___ dang2 ngo5 gong2 jyun4 sin1 ceot1 seng1.", answer: "dak6 dang1", answer_hanzi: 特登, en: "He waited on purpose until I'd finished before he spoke."}
    - {hanzi: "我___都講唔過佢。", jyutping: "ngo5 ___ dou1 gong2 m4 gwo3 keoi5.", answer: "bat1 lau1", answer_hanzi: 不嬲, en: "I've never been able to out-argue him."}
