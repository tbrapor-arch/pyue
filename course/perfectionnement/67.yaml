exercises:
  translate:
    - {hanzi: "招牌舊咗，啲味依舊。", jyutping: "ziu1 paai4 gau6 zo2, di1 mei6 ji1 gau6.", en: "The sign has aged; the taste is still the same."}
    - {hanzi: "佢將個茶壺交俾個女接棒。", jyutping: "keoi5 zoeng1 go3 caa4 wu2 gaau1 bei2 go3 neoi2 zip3 paang5.", en: "He hands the teapot to his daughter to take over."}
    - {hanzi: "零三年沙士，個個都戴口罩。", jyutping: "ling4 saam1 nin4 saa1 si2, go3 go3 dou1 daai3 hau2 zaau3.", en: "During SARS in 2003, everyone wore a mask."}
    - {hanzi: "歲月行過，我哋仲喺度。", jyutping: "seoi3 jyut6 haang4 gwo3, ngo5 dei6 zung6 hai2 dou6.", en: "The years walk past, and we're still here."}
    - {hanzi: "呢首歌嘅主題好簡單。", jyutping: "ni1 sau2 go1 ge3 zyu2 tai4 hou2 gaan2 daan1.", en: "This song's theme is very simple."}
  fill:
    - {hanzi: "夜晚___，朝早開閘。", jyutping: "je6 maan5 ___, ziu1 zou2 hoi1 zaap6.", answer: "laai1 zaap6", answer_hanzi: 拉閘, en: "Shutter down at night, up in the morning."}
    - {hanzi: "佢塊面嘅___好似茶漬。", jyutping: "keoi5 faai3 min6 ge3 ___ hou2 ci5 caa4 zik1.", answer: "zau3 man4", answer_hanzi: 皺紋, en: "The wrinkles on his face are like tea stains."}
    - {hanzi: "業主加租，個心___。", jyutping: "jip6 zyu2 gaa1 zou1, go3 sam1 ___.", answer: "ding2 zyu6", answer_hanzi: 頂住, en: "The landlord raised the rent; the heart held on."}
    - {hanzi: "啲客都係熟口___。", jyutping: "di1 haak3 dou1 hai6 suk6 hau2 ___.", answer: "suk6 min6", answer_hanzi: 熟面, en: "The customers are all familiar faces."}
    - {hanzi: "首歌用 bass 做___。", jyutping: "sau2 go1 jung6 bass zou6 ___.", answer: "cin4 zau3", answer_hanzi: 前奏, en: "The song uses bass for the intro."}
