# Example sentences written for Lessons › 粵字, for characters that have no example sentence in words.hk.
# Each is built on a word and reading attested in words.hk. Not checked by a native speaker.
examples:
  矺: {hanzi: "攞嚿石頭矺住張地蓆啦。", jyutping: "lo2 gau6 sek6 tau4 zaak6 zyu6 zoeng1 dei6 zek6 laa1.", en: "Put a stone on the mat to hold it down."}
  讕: {hanzi: "佢考咗一次第一就成日讕叻。", jyutping: "keoi5 haau2 zo2 jat1 ci3 dai6 jat1 zau6 seng4 jat6 laan2 lek1.", en: "He came first in one exam and now he's always showing off."}
  砵: {hanzi: "後面架車一直砵我。", jyutping: "hau6 min6 gaa3 ce1 jat1 zik6 but1 ngo5.", en: "The car behind kept honking at me."}
  𢲡: {hanzi: "佢𢲡住我隻手唔肯放。", jyutping: "keoi5 naa2 zyu6 ngo5 zek3 sau2 m4 hang2 fong3.", en: "She grabbed my hand and wouldn't let go."}
  𠼮: {hanzi: "細佬𠼮我帶佢去海洋公園。", jyutping: "sai3 lou2 ngai1 ngo5 daai3 keoi5 heoi3 hoi2 joeng4 gung1 jyun2.", en: "My little brother begged me to take him to Ocean Park."}
  𤜯: {hanzi: "小心啲，嗰隻狗會𤜯人㗎。", jyutping: "siu2 sam1 di1, go2 zek3 gau2 wui5 kap6 jan4 gaa3.", en: "Be careful, that dog bites."}
  坼: {hanzi: "我喺球場嗌咗成晚，把聲坼晒。", jyutping: "ngo5 hai2 kau4 coeng4 aai3 zo2 seng4 maan5, baa2 seng1 caak3 saai3.", en: "I shouted all night at the stadium and my voice is completely hoarse."}
  𥇣: {hanzi: "佢好嬲噉𥇣住我，一句嘢都唔講。", jyutping: "keoi5 hou2 nau1 gam2 gwat6 zyu6 ngo5, jat1 geoi3 je5 dou1 m4 gong2.", en: "He glared at me angrily without saying a word."}
  撍: {hanzi: "到你撍牌喇，快啲啦。", jyutping: "dou3 nei5 cim4 paai2 laa3, faai3 di1 laa1.", en: "It's your turn to draw a card, hurry up."}
  㧻: {hanzi: "佢用手指㧻吓我，叫我望窗外。", jyutping: "keoi5 jung6 sau2 zi2 duk1 haa5 ngo5, giu3 ngo5 mong6 coeng1 ngoi6.", en: "He poked me with his finger and told me to look out of the window."}
  舦: {hanzi: "揸車嗰陣，雙手要揸實個舦。", jyutping: "zaa1 ce1 go2 zan6, soeng1 sau2 jiu3 zaa1 sat6 go3 taai5.", en: "When you drive, keep both hands firmly on the wheel."}
  膥: {hanzi: "佢蒸魚嗰陣特登揀咗條有膥嘅。", jyutping: "keoi5 zing1 jyu2 go2 zan6 dak6 dang1 gaan2 zo2 tiu4 jau5 ceon1 ge3.", en: "When she steamed fish, she deliberately picked one with roe."}
  肶: {hanzi: "我要一個雞肶飯，唔該。", jyutping: "ngo5 jiu3 jat1 go3 gai1 bei2 faan6, m4 goi1.", en: "A chicken leg with rice, please."}
  蔃: {hanzi: "呢啲菜好多蔃，咬極都咬唔爛。", jyutping: "ni1 di1 coi3 hou2 do1 koeng2, ngaau5 gik6 dou1 ngaau5 m4 laan6.", en: "These vegetables are so stringy that no matter how much I chew I can't get through them."}
  潲: {hanzi: "以前啲人會用潲水嚟餵豬。", jyutping: "ji5 cin4 di1 jan4 wui5 jung6 saau3 seoi2 lai4 wai3 zyu1.", en: "People used to feed pigs with swill."}
  煀: {hanzi: "阿媽今晚整咗薑葱煀鯉魚。", jyutping: "aa3 maa1 gam1 maan5 zing2 zo2 goeng1 cung1 wat1 lei5 jyu2.", en: "Mum made carp braised with ginger and spring onion tonight."}
  炩: {hanzi: "佢將對皮鞋擦到好炩。", jyutping: "keoi5 zoeng1 deoi3 pei4 haai4 caat3 dou3 hou2 ling3.", en: "He polished his leather shoes until they shone."}
  婄: {hanzi: "塊多士浸咗落奶茶度，婄晒。", jyutping: "faai3 do1 si2 zam3 zo2 lok6 naai5 caa4 dou6, pau3 saai3.", en: "The toast was dipped in the milk tea and went all soggy."}
  癐: {hanzi: "今日返咗十個鐘工，好癐。", jyutping: "gam1 jat6 faan1 zo2 sap6 go3 zung1 gung1, hou2 gui6.", en: "I worked ten hours today, I'm exhausted."}
  𠱃: {hanzi: "我個水樽跌落地，𠱃咗。", jyutping: "ngo5 go3 seoi2 zeon1 dit3 lok6 dei6, nip1 zo2.", en: "My water bottle fell on the floor and got dented."}
  埲: {hanzi: "呢埲牆好耐冇油過喇。", jyutping: "ni1 bung6 coeng4 hou2 noi6 mou5 jau4 gwo3 laa3.", en: "This wall hasn't been painted for a long time."}
  蜞: {hanzi: "海邊啲石頭度有好多蟛蜞。", jyutping: "hoi2 bin1 di1 sek6 tau4 dou6 jau5 hou2 do1 paang4 kei2.", en: "There are lots of little crabs among the rocks by the sea."}
  𩩍: {hanzi: "呢張櫈冇櫈𩩍，坐耐咗腰骨痛。", jyutping: "ni1 zoeng1 dang3 mou5 dang3 peng1, co5 noi6 zo2 jiu1 gwat1 tung3.", en: "This chair has no backrest, so my back hurts after sitting for a while."}
  屘: {hanzi: "我閂門嗰陣夾親隻屘指。", jyutping: "ngo5 saan1 mun4 go2 zan6 gaap3 can1 zek3 mei1 zi2.", en: "I caught my little finger when I shut the door."}
  䱽: {hanzi: "阿媽今日買咗條䱽魚返嚟煎。", jyutping: "aa3 maa1 gam1 jat6 maai5 zo2 tiu4 cong1 jyu2 faan1 lai4 zin1.", en: "Mum bought a pomfret today to pan-fry."}
  艔: {hanzi: "以前啲人搭花尾艔返鄉下。", jyutping: "ji5 cin4 di1 jan4 daap3 faa1 mei5 dou2 faan1 hoeng1 haa2.", en: "In the old days people took the decorated passenger boats back to their home villages."}
  𦉘: {hanzi: "佢哋搬屋，連砂煲罌𦉘都要執埋。", jyutping: "keoi5 dei6 bun1 uk1, lin4 saa1 bou1 aang1 caang1 dou1 jiu3 zap1 maai4.", en: "They're moving house and have to pack up even all the pots and pans."}
  鱲: {hanzi: "我哋要早啲去赤鱲角機場。", jyutping: "ngo5 dei6 jiu3 zou2 di1 heoi3 cek3 laap6 gok3 gei1 coeng4.", en: "We need to get to the Chek Lap Kok airport early."}
  軨: {hanzi: "架單車個呔軨撞彎咗。", jyutping: "gaa3 daan1 ce1 go3 taai1 ling1 zong6 waan1 zo2.", en: "The bicycle's wheel rim got bent in the crash."}
  𦟌: {hanzi: "我最鍾意食滷水牛𦟌。", jyutping: "ngo5 zeoi3 zung1 ji3 sik6 lou5 seoi2 ngau4 zin2.", en: "My favourite is braised beef shank."}
  𢴈: {hanzi: "發燒之後，我成個人軟𢴈𢴈。", jyutping: "faat3 siu1 zi1 hau6, ngo5 seng4 go3 jan4 jyun5 daat3 daat3.", en: "After the fever I feel all weak and limp."}
  胗: {hanzi: "我叫咗一碟滷水雞胗。", jyutping: "ngo5 giu3 zo2 jat1 dip6 lou5 seoi2 gai1 zan1.", en: "I ordered a plate of braised chicken gizzards."}
  𡙁: {hanzi: "你唔好貪口𡙁亂講嘢啦。", jyutping: "nei5 m4 hou2 taam1 hau2 song2 lyun6 gong2 je5 laa1.", en: "Don't just blurt things out without thinking."}
